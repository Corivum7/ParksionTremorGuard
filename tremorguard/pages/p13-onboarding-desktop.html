    <style id="theme-vars">
/* ============================================================
   TremorGuard Design System — colors_and_type.css
   Parkinson's Tremor Monitoring Platform
   WCAG 2.1 AA · 56px touch targets · 17px body baseline
   ============================================================ */

/* ---- Font Imports ---- */
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap');

/* ============================================================
   1. SEMANTIC ALIASES (brand prefix: tg)
   ============================================================ */
:root {
  /* --- Core palette (user-specified exact values) --- */
  --primary: #0d9488;
  --primary-dark: #0f766e;
  --primary-light: #ccfbf1;

  --secondary: #0369a1;
  --secondary-light: #e0f2fe;

  --danger: #dc2626;
  --danger-light: #fee2e2;
  --warning: #d97706;
  --warning-light: #fef3c7;
  --success: #16a34a;
  --success-light: #dcfce7;
  --accent: #c2410c;
  --accent-light: #fed7aa;

  --bg: #f8fafc;
  --surface: #ffffff;
  --surface2: #f1f5f9;
  --ink: #0f172a;
  --ink2: #334155;
  --muted: #64748b;
  --border: #e2e8f0;

  /* --- Semantic aliases (tg prefix) --- */
  --tg-background: var(--bg);
  --tg-foreground: var(--ink);
  --tg-card: var(--surface);
  --tg-card-foreground: var(--ink);
  --tg-popover: var(--surface);
  --tg-popover-foreground: var(--ink);
  --tg-primary: var(--primary);
  --tg-primary-foreground: #ffffff;
  --tg-secondary: var(--secondary);
  --tg-secondary-foreground: #ffffff;
  --tg-muted: var(--surface2);
  --tg-muted-foreground: var(--muted);
  --tg-accent: var(--accent);
  --tg-accent-foreground: #ffffff;
  --tg-destructive: var(--danger);
  --tg-destructive-foreground: #ffffff;
  --tg-success: var(--success);
  --tg-success-foreground: #ffffff;
  --tg-warning: var(--warning);
  --tg-warning-foreground: #ffffff;
  --tg-border: var(--border);
  --tg-input: var(--border);
  --tg-ring: var(--primary);

  /* --- Radius scale --- */
  --tg-radius-small: 6px;
  --tg-radius-medium: 8px;
  --tg-radius-large: 12px;
  --tg-radius-full: 9999px;

  /* --- Typography tokens --- */
  --tg-font: 'Outfit', system-ui, -apple-system, sans-serif;
  --tg-font-mono: 'Geist Mono', 'SF Mono', 'Consolas', monospace;

  --tg-text-display: 32px;
  --tg-text-h1: 24px;
  --tg-text-h2: 20px;
  --tg-text-h3: 18px;
  --tg-text-body-lg: 17px;
  --tg-text-body: 16px;
  --tg-text-caption: 14px;
  --tg-text-label: 12px;

  /* --- Spacing scale --- */
  --tg-space-xs: 4px;
  --tg-space-sm: 8px;
  --tg-space-md: 12px;
  --tg-space-lg: 16px;
  --tg-space-xl: 24px;
  --tg-space-2xl: 32px;

  /* --- Radius (user spec) --- */
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 999px;

  /* --- Spacing (user spec, mirrored) --- */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 24px;
  --space-2xl: 32px;

  /* --- Shadows --- */
  --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.08);
  --shadow-elevated: 0 4px 12px rgba(15, 23, 42, 0.10);
  --shadow-modal: 0 8px 32px rgba(15, 23, 42, 0.15);

  /* --- Animation tokens --- */
  --ease-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --ease-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);
  --ease-slow: 400ms cubic-bezier(0.4, 0, 0.2, 1);
  --ease-spring: 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
  --pulse: 1.2s infinite alternate;

  /* --- Touch target --- */
  --touch-min: 56px;
  --tab-bar-height: 64px;
  --safe-area-bottom: 34px;
}

/* ============================================================
   2. DARK MODE (Phase 2 mappings)
   ============================================================ */
[data-theme="dark"] {
  --bg: #0f172a;
  --surface: #1e293b;
  --surface2: #334155;
  --ink: #f1f5f9;
  --ink2: #cbd5e1;
  --muted: #94a3b8;
  --border: #334155;

  --primary-light: #134e4a;
  --secondary-light: #0c4a6e;
  --danger-light: #7f1d1d;
  --warning-light: #78350f;
  --success-light: #14532d;
  --accent-light: #7c2d12;

  --tg-background: var(--bg);
  --tg-foreground: var(--ink);
  --tg-card: var(--surface);
  --tg-card-foreground: var(--ink);
  --tg-popover: var(--surface);
  --tg-popover-foreground: var(--ink);
  --tg-muted: var(--surface2);
  --tg-muted-foreground: var(--muted);
  --tg-border: var(--border);
  --tg-input: var(--border);
}

/* ============================================================
   3. TAILWIND v4 @theme INLINE
   ============================================================ */
@theme inline {
  --color-background: var(--bg);
  --color-foreground: var(--ink);
  --color-card: var(--surface);
  --color-card-foreground: var(--ink);
  --color-popover: var(--surface);
  --color-popover-foreground: var(--ink);
  --color-primary: var(--primary);
  --color-primary-foreground: #ffffff;
  --color-secondary: var(--secondary);
  --color-secondary-foreground: #ffffff;
  --color-muted: var(--surface2);
  --color-muted-foreground: var(--muted);
  --color-accent: var(--accent);
  --color-accent-foreground: #ffffff;
  --color-destructive: var(--danger);
  --color-destructive-foreground: #ffffff;
  --color-success: var(--success);
  --color-warning: var(--warning);
  --color-danger: var(--danger);
  --color-border: var(--border);
  --color-input: var(--border);
  --color-ring: var(--primary);

  --color-ink: var(--ink);
  --color-ink2: var(--ink2);
  --color-surface2: var(--surface2);

  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 999px;

  --font-sans: 'Outfit', system-ui, -apple-system, sans-serif;
  --font-mono: 'Geist Mono', 'SF Mono', monospace;
}

/* ============================================================
   4. BASE STYLES
   ============================================================ */
* {
  -webkit-tap-highlight-color: transparent;
}

html {
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--tg-font);
  background-color: var(--bg);
  color: var(--ink);
  line-height: 1.7;
  margin: 0;
  padding: 0;
  font-feature-settings: 'cv11', 'ss01';
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ---- Typography utility classes ---- */
.text-display { font-size: var(--tg-text-display); font-weight: 700; line-height: 1.2; }
.text-h1 { font-size: var(--tg-text-h1); font-weight: 700; line-height: 1.3; }
.text-h2 { font-size: var(--tg-text-h2); font-weight: 700; line-height: 1.4; }
.text-h3 { font-size: var(--tg-text-h3); font-weight: 600; line-height: 1.4; }
.text-body-lg { font-size: var(--tg-text-body-lg); font-weight: 400; line-height: 1.7; }
.text-body { font-size: var(--tg-text-body); font-weight: 400; line-height: 1.7; }
.text-caption { font-size: var(--tg-text-caption); font-weight: 400; line-height: 1.5; }
.text-label { font-size: var(--tg-text-label); font-weight: 600; line-height: 1.4; text-transform: uppercase; letter-spacing: 0.05em; }
.text-mono { font-family: var(--tg-font-mono); }

/* ---- Focus ring (WCAG 2.1 AA) ---- */
*:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

/* ---- Reduced motion ---- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0ms !important;
    transition-duration: 0ms !important;
  }
}

/* ---- Spinner ---- */
@keyframes tg-spin {
  to { transform: rotate(360deg); }
}
    </style>

    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--tg-background);
    --color-foreground: var(--tg-foreground);
    --color-card: var(--tg-card);
    --color-card-foreground: var(--tg-card-foreground);
    --color-popover: var(--tg-popover);
    --color-popover-foreground: var(--tg-popover-foreground);
    --color-primary: var(--tg-primary);
    --color-secondary: var(--tg-secondary);
    --color-muted: var(--tg-muted);
    --color-muted-foreground: var(--tg-muted-foreground);
    --color-accent: var(--tg-accent);
    --color-destructive: var(--tg-destructive);
    --color-success: var(--success);
    --color-warning: var(--warning);
    --color-danger: var(--danger);
    --color-border: var(--tg-border);
    --color-input: var(--tg-input);
    --color-ring: var(--tg-ring);
    --color-ink: var(--ink);
    --color-ink2: var(--ink2);
    --color-surface2: var(--surface2);
    --color-primary-foreground: var(--tg-primary-foreground);
    --color-secondary-foreground: var(--tg-secondary-foreground);
    --color-accent-foreground: var(--tg-accent-foreground);
    --color-destructive-foreground: var(--tg-destructive-foreground);
    --radius-sm: var(--tg-radius-small);
    --radius-md: var(--tg-radius-medium);
    --radius-lg: var(--tg-radius-large);
  }
  @layer base {
    body { background: var(--tg-background); color: var(--tg-foreground); }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--tg-background); }
      .text-foreground { color: var(--tg-foreground); }
      .bg-card { background-color: var(--tg-card); }
      .text-card-foreground { color: var(--tg-card-foreground); }
      .bg-primary { background-color: var(--tg-primary); }
      .text-primary { color: var(--tg-primary); }
      .border-primary { border-color: var(--tg-primary); }
      .bg-muted { background-color: var(--tg-muted); }
      .text-muted-foreground { color: var(--tg-muted-foreground); }
      .bg-surface2 { background-color: var(--surface2); }
      .text-ink { color: var(--ink); }
      .text-ink2 { color: var(--ink2); }
      .border-border { border-color: var(--tg-border); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }

      /* ---- Scan line animation (responsive via % of parent) ---- */
      @keyframes tg-scan {
        0% { top: 6px; opacity: 0.2; }
        25% { opacity: 1; }
        50% { top: calc(100% - 6px); opacity: 1; }
        75% { opacity: 1; }
        100% { top: 6px; opacity: 0.2; }
      }
      .scan-line {
        position: absolute;
        left: 14px;
        right: 14px;
        height: 2px;
        background: var(--primary);
        box-shadow: 0 0 10px var(--primary);
        border-radius: var(--radius-pill);
        animation: tg-scan 2.4s ease-in-out infinite;
      }

      /* ---- Small spinner (status hint) ---- */
      .spinner-sm {
        width: 16px;
        height: 16px;
        border: 2px solid var(--primary-light);
        border-top-color: var(--primary);
        border-radius: var(--radius-pill);
        animation: tg-spin 0.8s linear infinite;
        flex-shrink: 0;
      }

      /* ============================================================
         DESKTOP LAYOUT — Centered Card (no sidebar, focused task flow)
         ============================================================ */
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .desktop-shell {
        width: 100%;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* ---- Top Bar (64px, centered) ---- */
      .top-bar {
        width: 100%;
        height: 64px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 var(--space-xl);
        box-sizing: border-box;
        position: sticky;
        top: 0;
        z-index: 40;
      }
      .top-bar-inner {
        display: flex;
        align-items: center;
        gap: var(--space-md);
      }
      .logo-mark {
        width: 32px;
        height: 32px;
        border-radius: var(--radius-md);
        background: var(--primary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--tg-primary-foreground);
        flex-shrink: 0;
      }
      .brand-name {
        font-size: var(--tg-text-h3);
        font-weight: 700;
        color: var(--ink);
        letter-spacing: -0.01em;
      }
      .top-bar-sep {
        color: var(--border);
        font-size: var(--tg-text-h3);
        font-weight: 400;
      }
      .top-bar-title {
        font-size: var(--tg-text-body-lg);
        font-weight: 600;
        color: var(--ink2);
      }

      /* ---- Desktop stage (centers progress + card + nav) ---- */
      .desktop-stage {
        flex: 1;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--space-2xl);
        padding: 40px var(--space-xl);
        box-sizing: border-box;
      }

      /* ---- Progress Stepper ---- */
      .stepper-wrap {
        width: 100%;
        display: flex;
        justify-content: center;
      }
      .stepper {
        width: 100%;
        max-width: 800px;
        display: flex;
        align-items: flex-start;
      }
      .step-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-sm);
        flex-shrink: 0;
      }
      .step-circle {
        width: 40px;
        height: 40px;
        border-radius: var(--radius-pill);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        font-weight: 700;
        background: var(--surface);
        border: 2px solid var(--border);
        color: var(--muted);
        transition: all var(--ease-normal);
      }
      .step-completed {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--tg-primary-foreground);
      }
      .step-active {
        background: var(--surface);
        border-color: var(--primary);
        color: var(--primary);
        box-shadow: 0 0 0 4px var(--primary-light);
      }
      .step-label {
        font-size: var(--tg-text-caption);
        color: var(--muted);
        font-weight: 500;
        white-space: nowrap;
      }
      .step-label-active {
        color: var(--primary);
        font-weight: 700;
      }
      .step-label-done {
        color: var(--ink2);
        font-weight: 600;
      }
      .step-connector {
        flex: 1;
        height: 2px;
        background: var(--border);
        margin-top: 19px;
        min-width: 16px;
        border-radius: var(--radius-pill);
      }
      .step-connector-done {
        background: var(--primary);
      }

      /* ---- Main Content Card ---- */
      .card-wrap {
        width: 100%;
        display: flex;
        justify-content: center;
      }
      .onboarding-card {
        width: 100%;
        max-width: 640px;
        background: var(--surface);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-card);
        border: 1px solid var(--border);
        padding: 40px;
        box-sizing: border-box;
      }
      .card-header {
        text-align: center;
        margin-bottom: var(--space-2xl);
      }
      .card-title {
        font-size: var(--tg-text-h1);
        font-weight: 700;
        color: var(--ink);
        margin: 0 0 var(--space-sm) 0;
        line-height: 1.3;
      }
      .card-subtitle {
        font-size: var(--tg-text-body);
        color: var(--muted);
        margin: 0;
      }

      /* ---- QR Scan Frame (200x200, dashed border, teal corners) ---- */
      .qr-frame {
        width: 200px;
        height: 200px;
        margin: 0 auto;
        border: 2px dashed var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface2);
        position: relative;
        overflow: hidden;
      }
      .qr-corner {
        position: absolute;
        width: 22px;
        height: 22px;
      }
      .qr-corner-tl {
        top: -2px;
        left: -2px;
        border-top: 3px solid var(--primary);
        border-left: 3px solid var(--primary);
        border-top-left-radius: var(--radius-md);
      }
      .qr-corner-tr {
        top: -2px;
        right: -2px;
        border-top: 3px solid var(--primary);
        border-right: 3px solid var(--primary);
        border-top-right-radius: var(--radius-md);
      }
      .qr-corner-bl {
        bottom: -2px;
        left: -2px;
        border-bottom: 3px solid var(--primary);
        border-left: 3px solid var(--primary);
        border-bottom-left-radius: var(--radius-md);
      }
      .qr-corner-br {
        bottom: -2px;
        right: -2px;
        border-bottom: 3px solid var(--primary);
        border-right: 3px solid var(--primary);
        border-bottom-right-radius: var(--radius-md);
      }
      .qr-center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--space-sm);
        color: var(--muted);
      }

      /* ---- Device ID Input (44px) ---- */
      .field-group {
        margin-top: var(--space-2xl);
      }
      .field-label {
        display: block;
        font-size: var(--tg-text-caption);
        font-weight: 600;
        color: var(--ink2);
        margin-bottom: var(--space-sm);
      }
      .device-input {
        width: 100%;
        height: 44px;
        padding: 0 var(--space-lg);
        font-size: var(--tg-text-body);
        font-family: var(--tg-font);
        color: var(--ink);
        background: var(--surface);
        border: 2px solid var(--border);
        border-radius: var(--radius-md);
        box-sizing: border-box;
        transition: border-color var(--ease-normal), box-shadow var(--ease-normal);
      }
      .device-input:focus {
        border-color: var(--primary);
        outline: none;
        box-shadow: 0 0 0 3px var(--primary-light);
      }
      .device-input::placeholder {
        color: var(--muted);
      }
      .field-hint {
        margin-top: var(--space-sm);
        font-size: var(--tg-text-caption);
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: var(--space-xs);
      }

      /* ---- Status hint (spinner + text) ---- */
      .status-hint {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-sm);
        margin-top: var(--space-xl);
        padding: var(--space-md) var(--space-lg);
        background: var(--primary-light);
        border-radius: var(--radius-md);
      }
      .status-hint-text {
        font-size: var(--tg-text-caption);
        font-weight: 600;
        color: var(--primary-dark);
      }

      /* ---- Bottom Nav Buttons ---- */
      .nav-row {
        width: 100%;
        max-width: 640px;
        display: flex;
        justify-content: space-between;
        gap: var(--space-lg);
      }
      .btn-step {
        height: 44px;
        min-width: 140px;
        padding: 0 var(--space-xl);
        border-radius: var(--radius-md);
        font-size: var(--tg-text-body);
        font-weight: 700;
        font-family: var(--tg-font);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-sm);
        cursor: pointer;
        transition: transform var(--ease-fast), background var(--ease-fast), border-color var(--ease-fast), color var(--ease-fast);
      }
      .btn-next {
        background: var(--primary);
        color: var(--tg-primary-foreground);
        border: none;
      }
      .btn-next:hover { background: var(--primary-dark); }
      .btn-next:active { transform: scale(0.98); }
      .btn-prev {
        background: var(--surface);
        color: var(--ink2);
        border: 2px solid var(--border);
      }
      .btn-prev:hover {
        border-color: var(--primary);
        color: var(--primary);
      }
      .btn-prev:active { transform: scale(0.98); }

      /* ============================================================
         RESPONSIVE — @media (max-width: 767px)
         ============================================================ */
      @media (max-width: 767px) {
        .onboarding-card { padding: 24px; }
        .qr-frame { width: 160px; height: 160px; }
        .stepper { flex-wrap: wrap; gap: var(--space-md); justify-content: center; }
        .step-circle { width: 32px; height: 32px; font-size: 13px; }
        .step-connector { margin-top: 15px; min-width: 12px; }
        .step-label { font-size: var(--tg-text-label); }
        .desktop-stage { padding: 24px var(--space-lg); gap: var(--space-xl); }
        .btn-step { flex: 1; min-width: 0; padding: 0 var(--space-lg); }
        .brand-name { font-size: var(--tg-text-body-lg); }
        .top-bar-title { font-size: var(--tg-text-body); }
        .card-header { margin-bottom: var(--space-xl); }
        .field-group { margin-top: var(--space-xl); }
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <div class="desktop-shell">

        <!-- ============================================================
             TOP BAR (64px, centered) — TremorGuard logo + title
             ============================================================ -->
        <header class="top-bar">
            <div class="top-bar-inner">
                <span class="logo-mark" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                    </svg>
                </span>
                <span class="brand-name">TremorGuard</span>
                <span class="top-bar-sep" aria-hidden="true">/</span>
                <span class="top-bar-title">首次配置引导</span>
            </div>
        </header>

        <!-- ============================================================
             DESKTOP STAGE — centers progress + card + nav
             ============================================================ -->
        <div class="desktop-stage">

            <!-- ============================================================
                 PROGRESS INDICATOR — Horizontal stepper (5 steps)
                 1.欢迎 (done) → 2.设备绑定 (active) → 3.用药方案 → 4.照护者 → 5.完成
                 ============================================================ -->
            <section class="stepper-wrap" aria-label="配置进度">
                <ol class="stepper">
                    <!-- Step 1: completed -->
                    <li class="step-item">
                        <span class="step-circle step-completed" aria-label="已完成">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 6 9 17l-5-5"/>
                            </svg>
                        </span>
                        <span class="step-label step-label-done">1. 欢迎</span>
                    </li>
                    <li class="step-connector step-connector-done" aria-hidden="true"></li>
                    <!-- Step 2: active -->
                    <li class="step-item">
                        <span class="step-circle step-active" aria-current="step">2</span>
                        <span class="step-label step-label-active">2. 设备绑定</span>
                    </li>
                    <li class="step-connector" aria-hidden="true"></li>
                    <!-- Step 3: pending -->
                    <li class="step-item">
                        <span class="step-circle">3</span>
                        <span class="step-label">3. 用药方案</span>
                    </li>
                    <li class="step-connector" aria-hidden="true"></li>
                    <!-- Step 4: pending -->
                    <li class="step-item">
                        <span class="step-circle">4</span>
                        <span class="step-label">4. 照护者</span>
                    </li>
                    <li class="step-connector" aria-hidden="true"></li>
                    <!-- Step 5: pending -->
                    <li class="step-item">
                        <span class="step-circle">5</span>
                        <span class="step-label">5. 完成</span>
                    </li>
                </ol>
            </section>

            <!-- ============================================================
                 MAIN CONTENT CARD — Step 2: 设备绑定
                 ============================================================ -->
            <main class="card-wrap">
                <article class="onboarding-card">
                    <!-- Title + instruction -->
                    <header class="card-header">
                        <h1 class="card-title">绑定您的腕带设备</h1>
                        <p class="card-subtitle">扫描腕带上的二维码进行绑定</p>
                    </header>

                    <!-- QR Scan Frame (200x200, dashed border, teal corners) -->
                    <div class="qr-frame" role="img" aria-label="二维码扫描框，等待扫描腕带二维码">
                        <!-- Teal corner L-shapes -->
                        <div class="qr-corner qr-corner-tl"></div>
                        <div class="qr-corner qr-corner-tr"></div>
                        <div class="qr-corner qr-corner-bl"></div>
                        <div class="qr-corner qr-corner-br"></div>

                        <!-- Center: device illustration + hint -->
                        <div class="qr-center">
                            <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.7;">
                                <circle cx="12" cy="12" r="6"/>
                                <path d="M12 10v2l1.5 1.5"/>
                                <path d="M16.5 5.5 16 2H8l-.5 3.5"/>
                                <path d="M7.5 18.5 8 22h8l.5-3.5"/>
                            </svg>
                            <span class="text-caption">将二维码对准框内</span>
                        </div>

                        <!-- Scanning line animation -->
                        <div class="scan-line" aria-hidden="true"></div>
                    </div>

                    <!-- Device ID input field (44px) -->
                    <div class="field-group">
                        <label for="device-id" class="field-label">设备 ID / HWID</label>
                        <input id="device-id" name="device-id" type="text" class="device-input" placeholder="输入或扫描设备 HWID，如 TG-2024-XXXX" autocomplete="off" />
                        <p class="field-hint">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
                                <circle cx="12" cy="12" r="10"/>
                                <path d="M12 16v-4"/>
                                <path d="M12 8h.01"/>
                            </svg>
                            可在腕带背面或包装盒上找到 HWID 编号
                        </p>
                    </div>

                    <!-- Status hint: 等待扫描... with spinner -->
                    <div class="status-hint" role="status" aria-live="polite">
                        <div class="spinner-sm" aria-hidden="true"></div>
                        <span class="status-hint-text">等待扫描...</span>
                    </div>
                </article>
            </main>

            <!-- ============================================================
                 BOTTOM NAV BUTTONS (centered, max-width 640px, flex between)
                 ============================================================ -->
            <nav class="nav-row" aria-label="步骤导航">
                <button type="button" class="btn-step btn-prev" data-dom-id="btn-prev">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
                        <path d="m12 19-7-7 7-7"/>
                        <path d="M19 12H5"/>
                    </svg>
                    上一步
                </button>
                <button type="button" class="btn-step btn-next" data-dom-id="btn-next">
                    下一步
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
                        <path d="M5 12h14"/>
                        <path d="m12 5 7 7-7 7"/>
                    </svg>
                </button>
            </nav>

        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
