/* ---- Font Imports ---- */
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap');

/* ============================================================
   1. SEMANTIC ALIASES (brand prefix: tg)
   Required by apply-html-head-contract.mjs
   ============================================================ */
:root {
  /* --- Core palette (user-specified exact values) --- */
  --primary: #0d9488;
  --primary-dark: #0f766e;
  --primary-light: #ccfbf1;

  --secondary: #0369a1;
  --secondary-light: #e0f2fe;

  --danger: #dc2626;
  --danger-light: #fee2e2;
  --warning: #d97706;
  --warning-light: #fef3c7;
  --success: #16a34a;
  --success-light: #dcfce7;
  --accent: #c2410c;
  --accent-light: #fed7aa;

  --bg: #f8fafc;
  --surface: #ffffff;
  --surface2: #f1f5f9;
  --ink: #0f172a;
  --ink2: #334155;
  --muted: #64748b;
  --border: #e2e8f0;

  /* --- Semantic aliases (tg prefix) --- */
  --tg-background: var(--bg);
  --tg-foreground: var(--ink);
  --tg-card: var(--surface);
  --tg-card-foreground: var(--ink);
  --tg-popover: var(--surface);
  --tg-popover-foreground: var(--ink);
  --tg-primary: var(--primary);
  --tg-primary-foreground: #ffffff;
  --tg-secondary: var(--secondary);
  --tg-secondary-foreground: #ffffff;
  --tg-muted: var(--surface2);
  --tg-muted-foreground: var(--muted);
  --tg-accent: var(--accent);
  --tg-accent-foreground: #ffffff;
  --tg-destructive: var(--danger);
  --tg-destructive-foreground: #ffffff;
  --tg-success: var(--success);
  --tg-success-foreground: #ffffff;
  --tg-warning: var(--warning);
  --tg-warning-foreground: #ffffff;
  --tg-border: var(--border);
  --tg-input: var(--border);
  --tg-ring: var(--primary);

  /* --- Radius scale --- */
  --tg-radius-small: 6px;
  --tg-radius-medium: 8px;
  --tg-radius-large: 12px;
  --tg-radius-full: 9999px;

  /* --- Typography tokens --- */
  --tg-font: 'Outfit', system-ui, -apple-system, sans-serif;
  --tg-font-mono: 'Geist Mono', 'SF Mono', 'Consolas', monospace;

  --tg-text-display: 32px;
  --tg-text-h1: 24px;
  --tg-text-h2: 20px;
  --tg-text-h3: 18px;
  --tg-text-body-lg: 17px;
  --tg-text-body: 16px;
  --tg-text-caption: 14px;
  --tg-text-label: 12px;

  /* --- Spacing scale --- */
  --tg-space-xs: 4px;
  --tg-space-sm: 8px;
  --tg-space-md: 12px;
  --tg-space-lg: 16px;
  --tg-space-xl: 24px;
  --tg-space-2xl: 32px;

  /* --- Radius (user spec) --- */
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 999px;

  /* --- Spacing (user spec, mirrored) --- */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 24px;
  --space-2xl: 32px;

  /* --- Shadows --- */
  --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.08);
  --shadow-elevated: 0 4px 12px rgba(15, 23, 42, 0.10);
  --shadow-modal: 0 8px 32px rgba(15, 23, 42, 0.15);

  /* --- Animation tokens --- */
  --ease-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --ease-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);
  --ease-slow: 400ms cubic-bezier(0.4, 0, 0.2, 1);
  --ease-spring: 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
  --pulse: 1.2s infinite alternate;

  /* --- Touch target --- */
  --touch-min: 56px;
  --tab-bar-height: 64px;
  --safe-area-bottom: 34px;

  /* --- Desktop touch target --- */
  --touch-desktop: 44px;
}

/* ============================================================
   2. DARK MODE (Phase 2 mappings)
   ============================================================ */
[data-theme="dark"] {
  --bg: #0f172a;
  --surface: #1e293b;
  --surface2: #334155;
  --ink: #f1f5f9;
  --ink2: #cbd5e1;
  --muted: #94a3b8;
  --border: #334155;

  --primary-light: #134e4a;
  --secondary-light: #0c4a6e;
  --danger-light: #7f1d1d;
  --warning-light: #78350f;
  --success-light: #14532d;
  --accent-light: #7c2d12;

  --tg-background: var(--bg);
  --tg-foreground: var(--ink);
  --tg-card: var(--surface);
  --tg-card-foreground: var(--ink);
  --tg-popover: var(--surface);
  --tg-popover-foreground: var(--ink);
  --tg-muted: var(--surface2);
  --tg-muted-foreground: var(--muted);
  --tg-border: var(--border);
  --tg-input: var(--border);
}

/* ============================================================
   3. TAILWIND v4 @theme INLINE
   ============================================================ */
@theme inline {
  --color-background: var(--bg);
  --color-foreground: var(--ink);
  --color-card: var(--surface);
  --color-card-foreground: var(--ink);
  --color-popover: var(--surface);
  --color-popover-foreground: var(--ink);
  --color-primary: var(--primary);
  --color-primary-foreground: #ffffff;
  --color-secondary: var(--secondary);
  --color-secondary-foreground: #ffffff;
  --color-muted: var(--surface2);
  --color-muted-foreground: var(--muted);
  --color-accent: var(--accent);
  --color-accent-foreground: #ffffff;
  --color-destructive: var(--danger);
  --color-destructive-foreground: #ffffff;
  --color-success: var(--success);
  --color-warning: var(--warning);
  --color-danger: var(--danger);
  --color-border: var(--border);
  --color-input: var(--border);
  --color-ring: var(--primary);

  --color-ink: var(--ink);
  --color-ink2: var(--ink2);
  --color-surface2: var(--surface2);

  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 999px;

  --font-sans: 'Outfit', system-ui, -apple-system, sans-serif;
  --font-mono: 'Geist Mono', 'SF Mono', monospace;
}

/* ============================================================
   4. BASE STYLES
   ============================================================ */
* {
  -webkit-tap-highlight-color: transparent;
}

html {
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--tg-font);
  background-color: var(--bg);
  color: var(--ink);
  line-height: 1.7;
  margin: 0;
  padding: 0;
  font-feature-settings: 'cv11', 'ss01';
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ---- Typography utility classes ---- */
.text-display { font-size: var(--tg-text-display); font-weight: 700; line-height: 1.2; }
.text-h1 { font-size: var(--tg-text-h1); font-weight: 700; line-height: 1.3; }
.text-h2 { font-size: var(--tg-text-h2); font-weight: 700; line-height: 1.4; }
.text-h3 { font-size: var(--tg-text-h3); font-weight: 600; line-height: 1.4; }
.text-body-lg { font-size: var(--tg-text-body-lg); font-weight: 400; line-height: 1.7; }
.text-body { font-size: var(--tg-text-body); font-weight: 400; line-height: 1.7; }
.text-caption { font-size: var(--tg-text-caption); font-weight: 400; line-height: 1.5; }
.text-label { font-size: var(--tg-text-label); font-weight: 600; line-height: 1.4; text-transform: uppercase; letter-spacing: 0.05em; }
.text-mono { font-family: var(--tg-font-mono); }

/* ---- Focus ring (WCAG 2.1 AA) ---- */
*:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

/* ---- Reduced motion ---- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0ms !important;
    transition-duration: 0ms !important;
  }
}

/* ============================================================
   5. COMPONENT CLASSES
   ============================================================ */

/* ---- Buttons ---- */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm);
  height: var(--touch-min);
  min-width: 200px;
  padding: 0 var(--space-xl);
  background: var(--primary);
  color: #ffffff;
  font-size: var(--tg-text-body-lg);
  font-weight: 700;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: transform var(--ease-fast), background var(--ease-fast);
}
.btn-primary:active { background: var(--primary-dark); transform: scale(0.98); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm);
  height: var(--touch-min);
  min-width: 200px;
  padding: 0 var(--space-xl);
  background: transparent;
  color: var(--primary);
  font-size: var(--tg-text-body-lg);
  font-weight: 700;
  border: 2px solid var(--primary);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: transform var(--ease-fast), background var(--ease-fast);
}
.btn-secondary:active { transform: scale(0.98); }

.btn-danger {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm);
  height: var(--touch-min);
  min-width: 200px;
  padding: 0 var(--space-xl);
  background: var(--danger);
  color: #ffffff;
  font-size: var(--tg-text-body-lg);
  font-weight: 700;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: transform var(--ease-fast);
}
.btn-danger:active { transform: scale(0.98); }

/* ---- Cards ---- */
.card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  padding: var(--space-lg);
}
.card-pressable {
  cursor: pointer;
  transition: transform var(--ease-normal), box-shadow var(--ease-normal);
}
.card-pressable:active {
  transform: scale(0.99);
  box-shadow: var(--shadow-elevated);
}

/* ---- Status badges ---- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: var(--space-xs);
  padding: 2px var(--space-sm);
  border-radius: var(--radius-pill);
  font-size: var(--tg-text-label);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.badge-on { background: var(--success-light); color: var(--success); }
.badge-off { background: var(--warning-light); color: var(--warning); }
.badge-danger { background: var(--danger-light); color: var(--danger); }
.badge-info { background: var(--secondary-light); color: var(--secondary); }
.badge-accent { background: var(--accent-light); color: var(--accent); }

/* ---- Status dots ---- */
.dot { width: 8px; height: 8px; border-radius: var(--radius-pill); display: inline-block; }
.dot-success { background: var(--success); }
.dot-warning { background: var(--warning); }
.dot-danger { background: var(--danger); }
.dot-primary { background: var(--primary); }

/* ---- Inputs ---- */
.input {
  width: 100%;
  height: var(--touch-min);
  padding: 0 var(--space-lg);
  font-size: var(--tg-text-body-lg);
  font-family: var(--tg-font);
  color: var(--ink);
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--radius-md);
  transition: border-color var(--ease-normal);
}
.input:focus { border-color: var(--primary); outline: none; }
.input-error { border-color: var(--danger); }

/* ---- Pulse animation (pending medication) ---- */
@keyframes tg-pulse {
  from { box-shadow: 0 0 0 0 rgba(13, 148, 136, 0.4); }
  to { box-shadow: 0 0 0 8px rgba(13, 148, 136, 0); }
}
.animate-pulse-ring { animation: var(--pulse); animation-name: tg-pulse; }

/* ---- Shimmer (skeleton loading) ---- */
@keyframes tg-shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
.skeleton {
  background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
  background-size: 200% 100%;
  animation: tg-shimmer 1.5s infinite;
}

/* ---- Spinner ---- */
@keyframes tg-spin {
  to { transform: rotate(360deg); }
}
.spinner {
  width: 24px;
  height: 24px;
  border: 3px solid rgba(255, 255, 255, 0.3);
  border-top-color: #ffffff;
  border-radius: 50%;
  animation: tg-spin 0.8s linear infinite;
}
.spinner-primary {
  border-color: rgba(13, 148, 136, 0.2);
  border-top-color: var(--primary);
}

/* ---- Mobile container ---- */
.mobile-frame {
  width: 390px;
  max-width: 100%;
  margin: 0 auto;
  background: var(--bg);
  min-height: 100vh;
  position: relative;
}

/* ---- Safe area bottom spacer ---- */
.safe-area-bottom {
  height: var(--safe-area-bottom);
}

        border: none;

        align-items: center;
        gap: 12px;
        flex-shrink: 0;

        width: 40px;
        height: 40px;

        justify-content: center;

        height: 44px;

        justify-content: center;

      .row-1 {
        display: grid;
        grid-template-columns: 3fr 2fr;
        gap: 20px;
        margin-bottom: 20px;

      .row-1-right {

        flex-direction: column;
        gap: 20px;
      }
      .row-2 { margin-bottom: 20px; }
      .row-3 {

        gap: 20px;
      }

      .hero-card { padding: 24px; }
      .hero-amp-row { display: flex; align-items: baseline; gap: 6px; }
      .hero-sparkline { display: block; width: 100%; height: 72px; }

        text-align: center;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;

        background: var(--danger-light);

        border-left: 4px solid var(--danger);

        align-items: center;
        justify-content: space-between;
        gap: 12px;

        align-items: flex-start;
        justify-content: space-between;

        margin-top: 8px;
      }

        flex-direction: column;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
        width: 96px;

        align-items: center;

        border: 2px solid var(--primary);

      .med-node-btn.future {
        background: var(--surface);
        border: 2px solid var(--border);
      }
      .med-line {
        flex: 1;
        height: 2px;
        background: var(--border);
        margin-top: 21px;
        min-width: 24px;
      }
      .med-line.done { background: var(--success); }

      .med-time.active { color: var(--primary); }
      .med-status { font-size: var(--tg-text-label); color: var(--ink2); }
      .med-status.muted { color: var(--muted); }
      .med-status.active { color: var(--primary); }

      /* ---- Quick stat card ---- */
      .stat-card {
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .stat-head { display: flex; align-items: center; gap: 10px; }
      .stat-icon {
        width: 40px;
        height: 40px;
        border-radius: var(--radius-md);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .stat-icon.primary { background: var(--primary-light); color: var(--primary-dark); }
      .stat-icon.success { background: var(--success-light); color: var(--success); }
      .stat-icon.secondary { background: var(--secondary-light); color: var(--secondary); }
      .stat-label { font-size: var(--tg-text-body); color: var(--muted); font-weight: 600; }
      .stat-value-row { display: flex; align-items: baseline; gap: 4px; }
      .stat-value { font-size: var(--tg-text-display); font-weight: 700; color: var(--ink); line-height: 1.1; }
      .stat-unit { font-size: var(--tg-text-body); color: var(--muted); }
      .stat-caption { font-size: var(--tg-text-caption); color: var(--muted); }

      /* ---- Mobile sidebar backdrop ---- */
      .sidebar-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: color-mix(in srgb, var(--ink) 40%, transparent);
        z-index: 35;
      }
      .sidebar-backdrop.show { display: block; }

      /* ============================================================

         ============================================================ */
      @media (max-width: 1023px) {

          grid-template-columns: 64px 1fr;
        }
        .sidebar-logo { padding: 0; justify-content: center; }
        .logo-text { display: none; }

        .nav-item { justify-content: center; padding: 0; width: 48px; }
        .nav-item .nav-label { display: none; }
        .sidebar-profile { justify-content: center; padding: 16px 8px; }
        .profile-text { display: none; }
      }

      /* ============================================================

      @media (max-width: 767px) {

          grid-template-columns: 1fr;

        }

        .logo-text { display: inline; }

        .nav-item .nav-label { display: inline; }
        .sidebar-profile { justify-content: flex-start; padding: 16px; }
        .profile-text { display: flex; }
        .row-1 { grid-template-columns: 1fr; }
        .app-main { padding: 16px; }
        .med-node { width: 72px; }
      }

                    <div class="med-node" data-dom-id="med-node-01">
                        <button class="med-node-btn done" aria-label="07:00 左旋多巴 已服用">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--surface)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                        </button>
                        <span class="med-time">07:00</span>
                        <span class="med-status">已服</span>
                    </div>

                    <div class="med-line done" aria-hidden="true"></div>

                    <!-- Node 2: 12:00 待服 (teal pulse) -->
                    <div class="med-node" data-dom-id="med-node-02">
                        <button class="med-node-btn pending animate-pulse-ring" aria-label="12:00 左旋多巴 待服用">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" fill="var(--primary)"/></svg>
                        </button>
                        <span class="med-time active">12:00</span>
                        <span class="med-status active">待服</span>
                    </div>

                    <div class="med-line" aria-hidden="true"></div>

                    <!-- Node 3: 18:00 未到 (gray) -->
                    <div class="med-node" data-dom-id="med-node-03">
                        <button class="med-node-btn future" aria-label="18:00 左旋多巴 未到时间">
                            <span style="width:8px;height:8px;border-radius:50%;background:var(--border);display:inline-block;"></span>
                        </button>
                        <span class="med-time">18:00</span>
                        <span class="med-status muted">未到</span>
                    </div>
                </div>
            </section>

            <!-- ===== Row 3: Quick stats grid (3 columns) ===== -->
            <section class="row-3" aria-label="快速统计">
                <!-- 震颤频次 -->
                <article class="card stat-card" data-dom-id="stat-freq">
                    <div class="stat-head">
                        <span class="stat-icon primary" aria-hidden="true">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                        </span>
                        <span class="stat-label">震颤频次</span>
                    </div>
                    <div class="stat-value-row">
                        <span class="stat-value">24</span>
                        <span class="stat-unit">次/小时</span>
                    </div>
                    <span class="stat-caption">今日平均</span>
                </article>

                <!-- 用药依从率 -->
                <article class="card stat-card" data-dom-id="stat-compliance">
                    <div class="stat-head">
                        <span class="stat-icon success" aria-hidden="true">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5 21 10a4.95 4.95 0 1 0-7-7L3.5 14a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg>
                        </span>
                        <span class="stat-label">用药依从率</span>
                    </div>
                    <div class="stat-value-row">
                        <span class="stat-value">92</span>
                        <span class="stat-unit">%</span>
                    </div>
                    <span class="stat-caption">近 7 日</span>
                </article>

                <!-- ON状态时长 -->
                <article class="card stat-card" data-dom-id="stat-on-duration">
                    <div class="stat-head">
                        <span class="stat-icon secondary" aria-hidden="true">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        </span>
                        <span class="stat-label">ON状态时长</span>
                    </div>
                    <div class="stat-value-row">
                        <span class="stat-value">6.5</span>
                        <span class="stat-unit">小时</span>
                    </div>
                    <span class="stat-caption">今日累计</span>
                </article>
            </section>

        </main>
    </div>

    <script>
      lucide.createIcons();
      // Mobile sidebar drawer toggle
      (function () {
        var hamburger = document.getElementById('hamburger-btn');
        var sidebar = document.getElementById('app-sidebar');
        var backdrop = document.getElementById('sidebar-backdrop');
        if (!hamburger || !sidebar || !backdrop) return;
        function toggle(force) {
          var open = typeof force === 'boolean' ? force : !sidebar.classList.contains('open');
          sidebar.classList.toggle('open', open);
          backdrop.classList.toggle('show', open);
        }
        hamburger.addEventListener('click', function () { toggle(); });
        backdrop.addEventListener('click', function () { toggle(false); });
      })();
    </script>
</body>
</html>
