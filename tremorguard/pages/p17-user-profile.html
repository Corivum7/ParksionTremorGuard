/* ============================================================
   TremorGuard Design System — colors_and_type.css
   Parkinson's Tremor Monitoring Platform
   WCAG 2.1 AA · 56px touch targets · 17px body baseline
   ============================================================ */

/* ---- Font Imports ---- */
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap');

/* ============================================================
   1. SEMANTIC ALIASES (brand prefix: tg)
   Required by apply-html-head-contract.mjs
   ============================================================ */
:root {
  /* --- Core palette (user-specified exact values) --- */
  --primary: #0d9488;
  --primary-dark: #0f766e;
  --primary-light: #ccfbf1;

  --secondary: #0369a1;
  --secondary-light: #e0f2fe;

  --danger: #dc2626;
  --danger-light: #fee2e2;
  --warning: #d97706;
  --warning-light: #fef3c7;
  --success: #16a34a;
  --success-light: #dcfce7;
  --accent: #c2410c;
  --accent-light: #fed7aa;

  --bg: #f8fafc;
  --surface: #ffffff;
  --surface2: #f1f5f9;
  --ink: #0f172a;
  --ink2: #334155;
  --muted: #64748b;
  --border: #e2e8f0;

  /* --- Semantic aliases (tg prefix) --- */
  --tg-background: var(--bg);
  --tg-foreground: var(--ink);
  --tg-card: var(--surface);
  --tg-card-foreground: var(--ink);
  --tg-popover: var(--surface);
  --tg-popover-foreground: var(--ink);
  --tg-primary: var(--primary);
  --tg-primary-foreground: #ffffff;
  --tg-secondary: var(--secondary);
  --tg-secondary-foreground: #ffffff;
  --tg-muted: var(--surface2);
  --tg-muted-foreground: var(--muted);
  --tg-accent: var(--accent);
  --tg-accent-foreground: #ffffff;
  --tg-destructive: var(--danger);
  --tg-destructive-foreground: #ffffff;
  --tg-success: var(--success);
  --tg-success-foreground: #ffffff;
  --tg-warning: var(--warning);
  --tg-warning-foreground: #ffffff;
  --tg-border: var(--border);
  --tg-input: var(--border);
  --tg-ring: var(--primary);

  /* --- Radius scale --- */
  --tg-radius-small: 6px;
  --tg-radius-medium: 8px;
  --tg-radius-large: 12px;
  --tg-radius-full: 9999px;

  /* --- Typography tokens --- */
  --tg-font: 'Outfit', system-ui, -apple-system, sans-serif;
  --tg-font-mono: 'Geist Mono', 'SF Mono', 'Consolas', monospace;

  --tg-text-display: 32px;
  --tg-text-h1: 24px;
  --tg-text-h2: 20px;
  --tg-text-h3: 18px;
  --tg-text-body-lg: 17px;
  --tg-text-body: 16px;
  --tg-text-caption: 14px;
  --tg-text-label: 12px;

  /* --- Spacing scale --- */
  --tg-space-xs: 4px;
  --tg-space-sm: 8px;
  --tg-space-md: 12px;
  --tg-space-lg: 16px;
  --tg-space-xl: 24px;
  --tg-space-2xl: 32px;

  /* --- Radius (user spec) --- */
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 999px;

  /* --- Spacing (user spec, mirrored) --- */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 24px;
  --space-2xl: 32px;

  /* --- Shadows --- */
  --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.08);
  --shadow-elevated: 0 4px 12px rgba(15, 23, 42, 0.10);
  --shadow-modal: 0 8px 32px rgba(15, 23, 42, 0.15);

  /* --- Animation tokens --- */
  --ease-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --ease-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);
  --ease-slow: 400ms cubic-bezier(0.4, 0, 0.2, 1);
  --ease-spring: 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
  --pulse: 1.2s infinite alternate;

  /* --- Touch target --- */
  --touch-min: 56px;
  --tab-bar-height: 64px;
  --safe-area-bottom: 34px;
}

/* ============================================================
   2. DARK MODE (Phase 2 mappings)
   ============================================================ */
[data-theme="dark"] {
  --bg: #0f172a;
  --surface: #1e293b;
  --surface2: #334155;
  --ink: #f1f5f9;
  --ink2: #cbd5e1;
  --muted: #94a3b8;
  --border: #334155;

  --primary-light: #134e4a;
  --secondary-light: #0c4a6e;
  --danger-light: #7f1d1d;
  --warning-light: #78350f;
  --success-light: #14532d;
  --accent-light: #7c2d12;

  --tg-background: var(--bg);
  --tg-foreground: var(--ink);
  --tg-card: var(--surface);
  --tg-card-foreground: var(--ink);
  --tg-popover: var(--surface);
  --tg-popover-foreground: var(--ink);
  --tg-muted: var(--surface2);
  --tg-muted-foreground: var(--muted);
  --tg-border: var(--border);
  --tg-input: var(--border);
}

/* ============================================================
   3. TAILWIND v4 @theme INLINE
   ============================================================ */
@theme inline {
  --color-background: var(--bg);
  --color-foreground: var(--ink);
  --color-card: var(--surface);
  --color-card-foreground: var(--ink);
  --color-popover: var(--surface);
  --color-popover-foreground: var(--ink);
  --color-primary: var(--primary);
  --color-primary-foreground: #ffffff;
  --color-secondary: var(--secondary);
  --color-secondary-foreground: #ffffff;
  --color-muted: var(--surface2);
  --color-muted-foreground: var(--muted);
  --color-accent: var(--accent);
  --color-accent-foreground: #ffffff;
  --color-destructive: var(--danger);
  --color-destructive-foreground: #ffffff;
  --color-success: var(--success);
  --color-warning: var(--warning);
  --color-danger: var(--danger);
  --color-border: var(--border);
  --color-input: var(--border);
  --color-ring: var(--primary);

  --color-ink: var(--ink);
  --color-ink2: var(--ink2);
  --color-surface2: var(--surface2);

  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 999px;

  --font-sans: 'Outfit', system-ui, -apple-system, sans-serif;
  --font-mono: 'Geist Mono', 'SF Mono', monospace;
}

/* ============================================================
   4. BASE STYLES
   ============================================================ */
* {
  -webkit-tap-highlight-color: transparent;
}

html {
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--tg-font);
  background-color: var(--bg);
  color: var(--ink);
  line-height: 1.7;
  margin: 0;
  padding: 0;
  font-feature-settings: 'cv11', 'ss01';
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ---- Typography utility classes ---- */
.text-display { font-size: var(--tg-text-display); font-weight: 700; line-height: 1.2; }
.text-h1 { font-size: var(--tg-text-h1); font-weight: 700; line-height: 1.3; }
.text-h2 { font-size: var(--tg-text-h2); font-weight: 700; line-height: 1.4; }
.text-h3 { font-size: var(--tg-text-h3); font-weight: 600; line-height: 1.4; }
.text-body-lg { font-size: var(--tg-text-body-lg); font-weight: 400; line-height: 1.7; }
.text-body { font-size: var(--tg-text-body); font-weight: 400; line-height: 1.7; }
.text-caption { font-size: var(--tg-text-caption); font-weight: 400; line-height: 1.5; }
.text-label { font-size: var(--tg-text-label); font-weight: 600; line-height: 1.4; text-transform: uppercase; letter-spacing: 0.05em; }
.text-mono { font-family: var(--tg-font-mono); }

/* ---- Focus ring (WCAG 2.1 AA) ---- */
*:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

/* ---- Reduced motion ---- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0ms !important;
    transition-duration: 0ms !important;
  }
}

/* ============================================================
   5. COMPONENT CLASSES
   ============================================================ */

/* ---- Buttons ---- */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm);
  height: var(--touch-min);
  min-width: 200px;
  padding: 0 var(--space-xl);
  background: var(--primary);
  color: #ffffff;
  font-size: var(--tg-text-body-lg);
  font-weight: 700;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: transform var(--ease-fast), background var(--ease-fast);
}
.btn-primary:active { background: var(--primary-dark); transform: scale(0.98); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm);
  height: var(--touch-min);
  min-width: 200px;
  padding: 0 var(--space-xl);
  background: transparent;
  color: var(--primary);
  font-size: var(--tg-text-body-lg);
  font-weight: 700;
  border: 2px solid var(--primary);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: transform var(--ease-fast), background var(--ease-fast);
}
.btn-secondary:active { transform: scale(0.98); }

.btn-danger {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm);
  height: var(--touch-min);
  min-width: 200px;
  padding: 0 var(--space-xl);
  background: var(--danger);
  color: #ffffff;
  font-size: var(--tg-text-body-lg);
  font-weight: 700;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: transform var(--ease-fast);
}
.btn-danger:active { transform: scale(0.98); }

/* ---- Cards ---- */
.card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  padding: var(--space-lg);
}
.card-pressable {
  cursor: pointer;
  transition: transform var(--ease-normal), box-shadow var(--ease-normal);
}
.card-pressable:active {
  transform: scale(0.99);
  box-shadow: var(--shadow-elevated);
}

/* ---- Status badges ---- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: var(--space-xs);
  padding: 2px var(--space-sm);
  border-radius: var(--radius-pill);
  font-size: var(--tg-text-label);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.badge-on { background: var(--success-light); color: var(--success); }
.badge-off { background: var(--warning-light); color: var(--warning); }
.badge-danger { background: var(--danger-light); color: var(--danger); }
.badge-info { background: var(--secondary-light); color: var(--secondary); }
.badge-accent { background: var(--accent-light); color: var(--accent); }

/* ---- Status dots ---- */
.dot { width: 8px; height: 8px; border-radius: var(--radius-pill); display: inline-block; }
.dot-success { background: var(--success); }
.dot-warning { background: var(--warning); }
.dot-danger { background: var(--danger); }
.dot-primary { background: var(--primary); }

/* ---- Inputs ---- */
.input {
  width: 100%;
  height: var(--touch-min);
  padding: 0 var(--space-lg);
  font-size: var(--tg-text-body-lg);
  font-family: var(--tg-font);
  color: var(--ink);
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--radius-md);
  transition: border-color var(--ease-normal);
}
.input:focus { border-color: var(--primary); outline: none; }
.input-error { border-color: var(--danger); }

/* ---- Pulse animation (pending medication) ---- */
@keyframes tg-pulse {
  from { box-shadow: 0 0 0 0 rgba(13, 148, 136, 0.4); }
  to { box-shadow: 0 0 0 8px rgba(13, 148, 136, 0); }
}
.animate-pulse-ring { animation: var(--pulse); animation-name: tg-pulse; }

/* ---- Shimmer (skeleton loading) ---- */
@keyframes tg-shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
.skeleton {
  background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
  background-size: 200% 100%;
  animation: tg-shimmer 1.5s infinite;
}

/* ---- Spinner ---- */
@keyframes tg-spin {
  to { transform: rotate(360deg); }
}
.spinner {
  width: 24px;
  height: 24px;
  border: 3px solid rgba(255, 255, 255, 0.3);
  border-top-color: #ffffff;
  border-radius: 50%;
  animation: tg-spin 0.8s linear infinite;
}
.spinner-primary {
  border-color: rgba(13, 148, 136, 0.2);
  border-top-color: var(--primary);
}

/* ---- Mobile container ---- */
.mobile-frame {
  width: 390px;
  max-width: 100%;
  margin: 0 auto;
  background: var(--bg);
  min-height: 100vh;
  position: relative;
}

/* ---- Safe area bottom spacer ---- */
.safe-area-bottom {
  height: var(--safe-area-bottom);
}

    <!-- 1. Back nav bar (sticky top) -->
    <nav data-dom-id="nav-bar" style="position:sticky; top:0; z-index:20; display:flex; align-items:center; height:56px; background:var(--surface); border-bottom:1px solid var(--border); padding:0 16px;">
      <button type="button" data-dom-id="back-btn" aria-label="返回" style="display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; min-height:40px; background:transparent; border:none; color:var(--ink); cursor:pointer; padding:0; flex-shrink:0;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <h1 class="text-h2" style="flex:1; text-align:center; color:var(--ink); margin:0;">用户主页</h1>
      <div aria-hidden="true" style="width:40px; height:40px; flex-shrink:0;"></div>
    </nav>

    <!-- 2. Profile header card -->
    <section data-dom-id="profile-header" style="background:linear-gradient(135deg, var(--primary-light), var(--secondary-light)); padding:32px 16px 28px; text-align:center;">
      <!-- Avatar -->
      <div style="width:72px; height:72px; border-radius:var(--radius-pill); background:var(--primary); color:#ffffff; display:inline-flex; align-items:center; justify-content:center; font-size:28px; font-weight:700; margin-bottom:12px; box-shadow:var(--shadow-elevated);">王</div>
      <!-- Name -->
      <h2 class="text-h1" style="color:var(--ink); margin:0 0 4px;">王伯伯</h2>
      <!-- Patient ID -->
      <p class="text-caption" style="color:var(--muted); margin:0 0 8px; font-family:var(--tg-font-mono);">TG-2024-0312</p>
      <!-- Basic info -->
      <p class="text-body" style="color:var(--ink2); margin:0 0 4px;">男 · 68岁 · 帕金森病 II 期</p>
      <!-- Diagnosis time -->
      <p class="text-caption" style="color:var(--muted); margin:0;">确诊时间: 2021年6月</p>
    </section>

    <!-- 3. Health summary card -->
    <section class="card" data-dom-id="health-summary" style="margin:16px;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
        <h3 class="text-h3" style="color:var(--ink); margin:0;">健康摘要</h3>
        <a href="#" style="color:var(--primary); font-size:var(--tg-text-caption); font-weight:600; text-decoration:none; display:inline-flex; align-items:center; gap:4px;">查看趋势
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </a>
      </div>
      <!-- 2x2 grid -->
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
        <!-- Cell 1: 病程 -->
        <div style="background:var(--surface2); border-radius:var(--radius-md); padding:12px;">
          <p class="text-label" style="color:var(--muted); margin:0 0 6px;">病程</p>
          <p class="text-h2" style="color:var(--primary); margin:0;">3年2个月</p>
        </div>
        <!-- Cell 2: Hoehn-Yahr 分期 -->
        <div style="background:var(--surface2); border-radius:var(--radius-md); padding:12px;">
          <p class="text-label" style="color:var(--muted); margin:0 0 6px;">Hoehn-Yahr 分期</p>
          <p class="text-h2" style="color:var(--ink); margin:0;">II 期</p>
        </div>
        <!-- Cell 3: 近7日平均震颤幅度 -->
        <div style="background:var(--surface2); border-radius:var(--radius-md); padding:12px;">
          <p class="text-label" style="color:var(--muted); margin:0 0 6px;">近7日平均震颤幅度</p>
          <p class="text-h2" style="color:var(--ink); margin:0;">0.42g</p>
        </div>
        <!-- Cell 4: ON/OFF 比例 -->
        <div style="background:var(--surface2); border-radius:var(--radius-md); padding:12px;">
          <p class="text-label" style="color:var(--muted); margin:0 0 6px;">ON/OFF 比例</p>
          <p class="text-h2" style="color:var(--success); margin:0;">78% / 22%</p>
        </div>
      </div>
    </section>

    <!-- 4. Device status card -->
    <section class="card" data-dom-id="device-status" style="margin:0 16px 16px;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
        <h3 class="text-h3" style="color:var(--ink); margin:0;">设备状态</h3>
        <a href="#" style="color:var(--primary); font-size:var(--tg-text-caption); font-weight:600; text-decoration:none; display:inline-flex; align-items:center; gap:4px;">管理
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </a>
      </div>
      <!-- Device info -->
      <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:12px;">
        <div style="flex:1; min-width:0;">
          <!-- Device name + binding status -->
          <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap;">
            <span class="text-body-lg" style="color:var(--ink); font-weight:600;">TremorGuard W1 Pro</span>
            <span class="badge badge-on">
              <span class="dot dot-success"></span>
              已绑定
            </span>
          </div>
          <!-- Battery -->
          <p class="text-body" style="color:var(--success); margin:0 0 4px; font-weight:600;">电量 82%</p>
          <!-- Last sync -->
          <p class="text-caption" style="color:var(--muted); margin:0 0 4px;">最后同步: 2分钟前</p>
          <!-- Device ID -->
          <p class="text-caption" style="color:var(--muted); margin:0; font-family:var(--tg-font-mono);">设备ID: TG-W1-A7K3</p>
        </div>
        <!-- Device icon -->
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; margin-top:4px;" aria-hidden="true">
          <rect x="6" y="3" width="12" height="18" rx="2"></rect>
          <path d="M9 7h6"></path>
          <circle cx="12" cy="12" r="2"></circle>
          <path d="M11 3h2"></path>
        </svg>
      </div>
      <!-- Battery progress bar -->
      <div style="height:6px; background:var(--surface2); border-radius:var(--radius-pill); overflow:hidden;">
        <div style="height:100%; width:82%; background:var(--success); border-radius:var(--radius-pill);"></div>
      </div>
    </section>

    <!-- 5. Care team card -->
    <section class="card" data-dom-id="care-team" style="margin:0 16px 16px;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
        <h3 class="text-h3" style="color:var(--ink); margin:0;">关怀团队</h3>
        <a href="#" style="color:var(--primary); font-size:var(--tg-text-caption); font-weight:600; text-decoration:none; display:inline-flex; align-items:center; gap:4px;">编辑
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </a>
      </div>

      <div style="display:flex; flex-direction:column; gap:12px;">
        <!-- Caregiver: 李阿姨 -->
        <div data-dom-id="caregiver-item" style="display:flex; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid var(--border);">
          <!-- Avatar -->
          <div style="width:40px; height:40px; border-radius:var(--radius-pill); background:var(--primary-light); color:var(--primary-dark); display:inline-flex; align-items:center; justify-content:center; font-size:16px; font-weight:700; flex-shrink:0;">李</div>
          <!-- Info -->
          <div style="flex:1; min-width:0;">
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:2px;">
              <span class="text-body" style="color:var(--ink); font-weight:600;">李阿姨</span>
              <span class="text-caption" style="color:var(--muted);">女儿</span>
            </div>
            <p class="text-caption" style="color:var(--muted); margin:0; font-family:var(--tg-font-mono);">138****6688</p>
          </div>
          <!-- Phone icon button -->
          <button type="button" data-dom-id="call-caregiver" aria-label="拨打李阿姨电话" style="display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; min-height:40px; background:var(--success-light); border:none; border-radius:var(--radius-pill); color:var(--success); cursor:pointer; flex-shrink:0;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
          </button>
        </div>

        <!-- Doctor: 张主任 -->
        <div data-dom-id="doctor-item" style="display:flex; align-items:center; gap:12px; padding:8px 0;">
          <!-- Avatar -->
          <div style="width:40px; height:40px; border-radius:var(--radius-pill); background:var(--secondary-light); color:var(--secondary); display:inline-flex; align-items:center; justify-content:center; font-size:16px; font-weight:700; flex-shrink:0;">张</div>
          <!-- Info -->
          <div style="flex:1; min-width:0;">
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:2px; flex-wrap:wrap;">
              <span class="text-body" style="color:var(--ink); font-weight:600;">张主任</span>
              <span class="text-caption" style="color:var(--muted);">神经内科主任医师</span>
            </div>
            <p class="text-caption" style="color:var(--muted); margin:0;">市第一人民医院</p>
          </div>
          <!-- Phone icon button -->
          <button type="button" data-dom-id="call-doctor" aria-label="拨打张主任电话" style="display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; min-height:40px; background:var(--success-light); border:none; border-radius:var(--radius-pill); color:var(--success); cursor:pointer; flex-shrink:0;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
          </button>
        </div>
      </div>
    </section>

    <!-- 6. Settings list card (no title) -->
    <section class="card" data-dom-id="settings-list" style="margin:0 16px 16px; padding:0; overflow:hidden;">

      <!-- Item 1: 通知设置 -->
      <button type="button" data-dom-id="setting-notifications" style="display:flex; align-items:center; gap:12px; width:100%; height:56px; min-height:56px; padding:0 16px; background:transparent; border:none; border-bottom:1px solid var(--border); cursor:pointer; text-align:left;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;" aria-hidden="true">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
          <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path>
        </svg>
        <span class="text-body-lg" style="color:var(--ink); flex:1;">通知设置</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>

      <!-- Item 2: 隐私与安全 -->
      <button type="button" data-dom-id="setting-privacy" style="display:flex; align-items:center; gap:12px; width:100%; height:56px; min-height:56px; padding:0 16px; background:transparent; border:none; border-bottom:1px solid var(--border); cursor:pointer; text-align:left;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;" aria-hidden="true">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        <span class="text-body-lg" style="color:var(--ink); flex:1;">隐私与安全</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>

      <!-- Item 3: 数据导出 -->
      <button type="button" data-dom-id="setting-export" style="display:flex; align-items:center; gap:12px; width:100%; height:56px; min-height:56px; padding:0 16px; background:transparent; border:none; border-bottom:1px solid var(--border); cursor:pointer; text-align:left;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span class="text-body-lg" style="color:var(--ink); flex:1;">数据导出</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>

      <!-- Item 4: 用药方案管理 -->
      <button type="button" data-dom-id="setting-medication" style="display:flex; align-items:center; gap:12px; width:100%; height:56px; min-height:56px; padding:0 16px; background:transparent; border:none; border-bottom:1px solid var(--border); cursor:pointer; text-align:left;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;" aria-hidden="true">
          <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"></path>
          <path d="m8.5 8.5 7 7"></path>
        </svg>
        <span class="text-body-lg" style="color:var(--ink); flex:1;">用药方案管理</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>

      <!-- Item 5: 帮助与反馈 -->
      <button type="button" data-dom-id="setting-help" style="display:flex; align-items:center; gap:12px; width:100%; height:56px; min-height:56px; padding:0 16px; background:transparent; border:none; border-bottom:1px solid var(--border); cursor:pointer; text-align:left;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <span class="text-body-lg" style="color:var(--ink); flex:1;">帮助与反馈</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>

      <!-- Item 6: 关于 TremorGuard -->
      <button type="button" data-dom-id="setting-about" style="display:flex; align-items:center; gap:12px; width:100%; height:56px; min-height:56px; padding:0 16px; background:transparent; border:none; cursor:pointer; text-align:left;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <span class="text-body-lg" style="color:var(--ink); flex:1;">关于 TremorGuard</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>

    </section>

    <!-- 7. Logout button -->
    <div style="margin:0 16px 16px;">
      <button type="button" data-dom-id="logout-btn" style="display:flex; align-items:center; justify-content:center; gap:8px; width:100%; height:56px; min-height:56px; background:transparent; color:var(--danger); font-size:var(--tg-text-body-lg); font-weight:700; border:2px solid var(--danger); border-radius:var(--radius-md); cursor:pointer; transition:transform var(--ease-fast);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        退出登录
      </button>
    </div>

    <!-- Bottom spacer (80px) -->
    <div style="height:80px;" aria-hidden="true"></div>

  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
