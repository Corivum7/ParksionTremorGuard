/* ============================================================
   TremorGuard Design System — colors_and_type.css
   Parkinson's Tremor Monitoring Platform
   WCAG 2.1 AA · 56px touch targets · 17px body baseline
   ============================================================ */

/* ---- Font Imports ---- */
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap');

/* ============================================================
   1. SEMANTIC ALIASES (brand prefix: tg)
   Required by apply-html-head-contract.mjs
   ============================================================ */
:root {
  /* --- Core palette (user-specified exact values) --- */
  --primary: #0d9488;
  --primary-dark: #0f766e;
  --primary-light: #ccfbf1;

  --secondary: #0369a1;
  --secondary-light: #e0f2fe;

  --danger: #dc2626;
  --danger-light: #fee2e2;
  --warning: #d97706;
  --warning-light: #fef3c7;
  --success: #16a34a;
  --success-light: #dcfce7;
  --accent: #c2410c;
  --accent-light: #fed7aa;

  --bg: #f8fafc;
  --surface: #ffffff;
  --surface2: #f1f5f9;
  --ink: #0f172a;
  --ink2: #334155;
  --muted: #64748b;
  --border: #e2e8f0;

  /* --- Semantic aliases (tg prefix) --- */
  --tg-background: var(--bg);
  --tg-foreground: var(--ink);
  --tg-card: var(--surface);
  --tg-card-foreground: var(--ink);
  --tg-popover: var(--surface);
  --tg-popover-foreground: var(--ink);
  --tg-primary: var(--primary);
  --tg-primary-foreground: #ffffff;
  --tg-secondary: var(--secondary);
  --tg-secondary-foreground: #ffffff;
  --tg-muted: var(--surface2);
  --tg-muted-foreground: var(--muted);
  --tg-accent: var(--accent);
  --tg-accent-foreground: #ffffff;
  --tg-destructive: var(--danger);
  --tg-destructive-foreground: #ffffff;
  --tg-success: var(--success);
  --tg-success-foreground: #ffffff;
  --tg-warning: var(--warning);
  --tg-warning-foreground: #ffffff;
  --tg-border: var(--border);
  --tg-input: var(--border);
  --tg-ring: var(--primary);

  /* --- Radius scale --- */
  --tg-radius-small: 6px;
  --tg-radius-medium: 8px;
  --tg-radius-large: 12px;
  --tg-radius-full: 9999px;

  /* --- Typography tokens --- */
  --tg-font: 'Outfit', system-ui, -apple-system, sans-serif;
  --tg-font-mono: 'Geist Mono', 'SF Mono', 'Consolas', monospace;

  --tg-text-display: 32px;
  --tg-text-h1: 24px;
  --tg-text-h2: 20px;
  --tg-text-h3: 18px;
  --tg-text-body-lg: 17px;
  --tg-text-body: 16px;
  --tg-text-caption: 14px;
  --tg-text-label: 12px;

  /* --- Spacing scale --- */
  --tg-space-xs: 4px;
  --tg-space-sm: 8px;
  --tg-space-md: 12px;
  --tg-space-lg: 16px;
  --tg-space-xl: 24px;
  --tg-space-2xl: 32px;

  /* --- Radius (user spec) --- */
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 999px;

  /* --- Spacing (user spec, mirrored) --- */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 24px;
  --space-2xl: 32px;

  /* --- Shadows --- */
  --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.08);
  --shadow-elevated: 0 4px 12px rgba(15, 23, 42, 0.10);
  --shadow-modal: 0 8px 32px rgba(15, 23, 42, 0.15);

  /* --- Animation tokens --- */
  --ease-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --ease-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);
  --ease-slow: 400ms cubic-bezier(0.4, 0, 0.2, 1);
  --ease-spring: 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
  --pulse: 1.2s infinite alternate;

  /* --- Touch target --- */
  --touch-min: 56px;
  --tab-bar-height: 64px;
  --safe-area-bottom: 34px;
}

/* ============================================================
   2. DARK MODE (Phase 2 mappings)
   ============================================================ */
[data-theme="dark"] {
  --bg: #0f172a;
  --surface: #1e293b;
  --surface2: #334155;
  --ink: #f1f5f9;
  --ink2: #cbd5e1;
  --muted: #94a3b8;
  --border: #334155;

  --primary-light: #134e4a;
  --secondary-light: #0c4a6e;
  --danger-light: #7f1d1d;
  --warning-light: #78350f;
  --success-light: #14532d;
  --accent-light: #7c2d12;

  --tg-background: var(--bg);
  --tg-foreground: var(--ink);
  --tg-card: var(--surface);
  --tg-card-foreground: var(--ink);
  --tg-popover: var(--surface);
  --tg-popover-foreground: var(--ink);
  --tg-muted: var(--surface2);
  --tg-muted-foreground: var(--muted);
  --tg-border: var(--border);
  --tg-input: var(--border);
}

/* ============================================================
   3. TAILWIND v4 @theme INLINE
   ============================================================ */
@theme inline {
  --color-background: var(--bg);
  --color-foreground: var(--ink);
  --color-card: var(--surface);
  --color-card-foreground: var(--ink);
  --color-popover: var(--surface);
  --color-popover-foreground: var(--ink);
  --color-primary: var(--primary);
  --color-primary-foreground: #ffffff;
  --color-secondary: var(--secondary);
  --color-secondary-foreground: #ffffff;
  --color-muted: var(--surface2);
  --color-muted-foreground: var(--muted);
  --color-accent: var(--accent);
  --color-accent-foreground: #ffffff;
  --color-destructive: var(--danger);
  --color-destructive-foreground: #ffffff;
  --color-success: var(--success);
  --color-warning: var(--warning);
  --color-danger: var(--danger);
  --color-border: var(--border);
  --color-input: var(--border);
  --color-ring: var(--primary);

  --color-ink: var(--ink);
  --color-ink2: var(--ink2);
  --color-surface2: var(--surface2);

  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 999px;

  --font-sans: 'Outfit', system-ui, -apple-system, sans-serif;
  --font-mono: 'Geist Mono', 'SF Mono', monospace;
}

/* ============================================================
   4. BASE STYLES
   ============================================================ */
* {
  -webkit-tap-highlight-color: transparent;
}

html {
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--tg-font);
  background-color: var(--bg);
  color: var(--ink);
  line-height: 1.7;
  margin: 0;
  padding: 0;
  font-feature-settings: 'cv11', 'ss01';
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ---- Typography utility classes ---- */
.text-display { font-size: var(--tg-text-display); font-weight: 700; line-height: 1.2; }
.text-h1 { font-size: var(--tg-text-h1); font-weight: 700; line-height: 1.3; }
.text-h2 { font-size: var(--tg-text-h2); font-weight: 700; line-height: 1.4; }
.text-h3 { font-size: var(--tg-text-h3); font-weight: 600; line-height: 1.4; }
.text-body-lg { font-size: var(--tg-text-body-lg); font-weight: 400; line-height: 1.7; }
.text-body { font-size: var(--tg-text-body); font-weight: 400; line-height: 1.7; }
.text-caption { font-size: var(--tg-text-caption); font-weight: 400; line-height: 1.5; }
.text-label { font-size: var(--tg-text-label); font-weight: 600; line-height: 1.4; text-transform: uppercase; letter-spacing: 0.05em; }
.text-mono { font-family: var(--tg-font-mono); }

/* ---- Focus ring (WCAG 2.1 AA) ---- */
*:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

/* ---- Reduced motion ---- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0ms !important;
    transition-duration: 0ms !important;
  }
}

/* ============================================================
   5. COMPONENT CLASSES
   ============================================================ */

/* ---- Buttons ---- */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm);
  height: var(--touch-min);
  min-width: 200px;
  padding: 0 var(--space-xl);
  background: var(--primary);
  color: #ffffff;
  font-size: var(--tg-text-body-lg);
  font-weight: 700;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: transform var(--ease-fast), background var(--ease-fast);
}
.btn-primary:active { background: var(--primary-dark); transform: scale(0.98); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm);
  height: var(--touch-min);
  min-width: 200px;
  padding: 0 var(--space-xl);
  background: transparent;
  color: var(--primary);
  font-size: var(--tg-text-body-lg);
  font-weight: 700;
  border: 2px solid var(--primary);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: transform var(--ease-fast), background var(--ease-fast);
}
.btn-secondary:active { transform: scale(0.98); }

.btn-danger {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm);
  height: var(--touch-min);
  min-width: 200px;
  padding: 0 var(--space-xl);
  background: var(--danger);
  color: #ffffff;
  font-size: var(--tg-text-body-lg);
  font-weight: 700;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: transform var(--ease-fast);
}
.btn-danger:active { transform: scale(0.98); }

/* ---- Cards ---- */
.card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  padding: var(--space-lg);
}
.card-pressable {
  cursor: pointer;
  transition: transform var(--ease-normal), box-shadow var(--ease-normal);
}
.card-pressable:active {
  transform: scale(0.99);
  box-shadow: var(--shadow-elevated);
}

/* ---- Status badges ---- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: var(--space-xs);
  padding: 2px var(--space-sm);
  border-radius: var(--radius-pill);
  font-size: var(--tg-text-label);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.badge-on { background: var(--success-light); color: var(--success); }
.badge-off { background: var(--warning-light); color: var(--warning); }
.badge-danger { background: var(--danger-light); color: var(--danger); }
.badge-info { background: var(--secondary-light); color: var(--secondary); }
.badge-accent { background: var(--accent-light); color: var(--accent); }

/* ---- Status dots ---- */
.dot { width: 8px; height: 8px; border-radius: var(--radius-pill); display: inline-block; }
.dot-success { background: var(--success); }
.dot-warning { background: var(--warning); }
.dot-danger { background: var(--danger); }
.dot-primary { background: var(--primary); }

/* ---- Inputs ---- */
.input {
  width: 100%;
  height: var(--touch-min);
  padding: 0 var(--space-lg);
  font-size: var(--tg-text-body-lg);
  font-family: var(--tg-font);
  color: var(--ink);
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--radius-md);
  transition: border-color var(--ease-normal);
}
.input:focus { border-color: var(--primary); outline: none; }
.input-error { border-color: var(--danger); }

/* ---- Pulse animation (pending medication) ---- */
@keyframes tg-pulse {
  from { box-shadow: 0 0 0 0 rgba(13, 148, 136, 0.4); }
  to { box-shadow: 0 0 0 8px rgba(13, 148, 136, 0); }
}
.animate-pulse-ring { animation: var(--pulse); animation-name: tg-pulse; }

/* ---- Shimmer (skeleton loading) ---- */
@keyframes tg-shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
.skeleton {
  background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
  background-size: 200% 100%;
  animation: tg-shimmer 1.5s infinite;
}

/* ---- Spinner ---- */
@keyframes tg-spin {
  to { transform: rotate(360deg); }
}
.spinner {
  width: 24px;
  height: 24px;
  border: 3px solid rgba(255, 255, 255, 0.3);
  border-top-color: #ffffff;
  border-radius: 50%;
  animation: tg-spin 0.8s linear infinite;
}
.spinner-primary {
  border-color: rgba(13, 148, 136, 0.2);
  border-top-color: var(--primary);
}

/* ---- Mobile container ---- */
.mobile-frame {
  width: 390px;
  max-width: 100%;
  margin: 0 auto;
  background: var(--bg);
  min-height: 100vh;
  position: relative;
}

/* ---- Safe area bottom spacer ---- */
.safe-area-bottom {
  height: var(--safe-area-bottom);
}

    <main class="mobile-frame pb-[120px] min-h-screen flex flex-col">

        <!-- ============================================================
             PROGRESS INDICATOR (Step 1 of 4)
             ============================================================ -->
        <section data-dom-id="progress-indicator" style="background: var(--surface); padding: 16px; border-bottom: 1px solid var(--border);">
            <div style="display: flex; justify-content: flex-end; margin-bottom: 12px;">
                <span class="text-caption" style="color: var(--muted);">1/4</span>
            </div>
            <div style="display: flex; gap: 8px;">
                <div style="flex: 1; height: 4px; background: var(--primary); border-radius: 2px;"></div>
                <div style="flex: 1; height: 4px; background: var(--border); border-radius: 2px;"></div>
                <div style="flex: 1; height: 4px; background: var(--border); border-radius: 2px;"></div>
                <div style="flex: 1; height: 4px; background: var(--border); border-radius: 2px;"></div>
            </div>
            <div style="display: flex; gap: 8px; margin-top: 8px;">
                <span class="text-caption" style="flex: 1; text-align: center; color: var(--primary); font-weight: 600;">设备绑定</span>
                <span class="text-caption" style="flex: 1; text-align: center; color: var(--muted);">用药方案</span>
                <span class="text-caption" style="flex: 1; text-align: center; color: var(--muted);">照护者</span>
                <span class="text-caption" style="flex: 1; text-align: center; color: var(--muted);">校准</span>
            </div>
        </section>

        <!-- ============================================================
             STEP CONTENT — Device Binding
             ============================================================ -->
        <section style="flex: 1; padding: 24px 16px;">

            <!-- Title + subtitle -->
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <h1 class="text-h1" style="color: var(--ink); margin: 0;">绑定您的腕带设备</h1>
                <p class="text-body-lg" style="color: var(--muted); margin: 0;">扫描腕带上的二维码或手动输入设备 ID</p>
            </div>

            <!-- QR Scan Frame (200x200) -->
            <div data-dom-id="qr-scan-frame" role="img" aria-label="二维码扫描框" style="width: 200px; height: 200px; margin: 32px auto; border-radius: var(--radius-lg); background: var(--surface2); position: relative; overflow: hidden;">

                <!-- Corner L-shapes: top-left -->
                <div style="position: absolute; top: 0; left: 0; width: 24px; height: 24px; border-top: 3px solid var(--primary); border-left: 3px solid var(--primary);"></div>
                <!-- Corner L-shapes: top-right -->
                <div style="position: absolute; top: 0; right: 0; width: 24px; height: 24px; border-top: 3px solid var(--primary); border-right: 3px solid var(--primary);"></div>
                <!-- Corner L-shapes: bottom-left -->
                <div style="position: absolute; bottom: 0; left: 0; width: 24px; height: 24px; border-bottom: 3px solid var(--primary); border-left: 3px solid var(--primary);"></div>
                <!-- Corner L-shapes: bottom-right -->
                <div style="position: absolute; bottom: 0; right: 0; width: 24px; height: 24px; border-bottom: 3px solid var(--primary); border-right: 3px solid var(--primary);"></div>

                <!-- Center content: subtle scan icon + hint text -->
                <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); opacity: 0.55;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
                        <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
                        <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
                        <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
                        <line x1="7" y1="12" x2="17" y2="12"/>
                    </svg>
                    <span class="text-caption">将二维码对准框内</span>
                </div>

                <!-- Scanning line animation -->
                <div class="scan-line" style="position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--primary); box-shadow: 0 0 8px var(--primary);"></div>
            </div>

            <!-- Permission buttons (vertical stack) -->
            <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 24px;">
                <button data-dom-id="btn-bluetooth" class="btn-primary" style="width: 100%;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
                        <path d="m7 7 10 10-5 5V2l5 5L7 17"/>
                    </svg>
                    允许蓝牙连接
                </button>
                <button data-dom-id="btn-notification" class="btn-secondary" style="width: 100%;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
                        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
                        <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
                    </svg>
                    允许通知提醒
                </button>
            </div>

            <!-- Manual input link -->
            <div style="text-align: center; margin-top: 16px;">
                <a href="#" data-dom-id="link-manual-input" class="text-body" style="color: var(--secondary); text-decoration: underline;">手动输入 HWID</a>
            </div>

        </section>

        <!-- ============================================================
             BOTTOM NAVIGATION (fixed) — Step 1: only "下一步" button
             ============================================================ -->
        <div style="position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 390px; max-width: 100%; background: var(--surface); border-top: 1px solid var(--border); padding: 16px; padding-bottom: calc(16px + var(--safe-area-bottom)); z-index: 50; box-sizing: border-box;">
            <button data-dom-id="btn-next" class="btn-primary" style="width: 100%;">下一步</button>
        </div>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
