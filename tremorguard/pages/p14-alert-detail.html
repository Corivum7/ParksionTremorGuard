/* ============================================================
   TremorGuard Design System — colors_and_type.css
   Parkinson's Tremor Monitoring Platform
   WCAG 2.1 AA · 56px touch targets · 17px body baseline
   ============================================================ */

/* ---- Font Imports ---- */
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap');

/* ============================================================
   1. SEMANTIC ALIASES (brand prefix: tg)
   Required by apply-html-head-contract.mjs
   ============================================================ */
:root {
  /* --- Core palette (user-specified exact values) --- */
  --primary: #0d9488;
  --primary-dark: #0f766e;
  --primary-light: #ccfbf1;

  --secondary: #0369a1;
  --secondary-light: #e0f2fe;

  --danger: #dc2626;
  --danger-light: #fee2e2;
  --warning: #d97706;
  --warning-light: #fef3c7;
  --success: #16a34a;
  --success-light: #dcfce7;
  --accent: #c2410c;
  --accent-light: #fed7aa;

  --bg: #f8fafc;
  --surface: #ffffff;
  --surface2: #f1f5f9;
  --ink: #0f172a;
  --ink2: #334155;
  --muted: #64748b;
  --border: #e2e8f0;

  /* --- Semantic aliases (tg prefix) --- */
  --tg-background: var(--bg);
  --tg-foreground: var(--ink);
  --tg-card: var(--surface);
  --tg-card-foreground: var(--ink);
  --tg-popover: var(--surface);
  --tg-popover-foreground: var(--ink);
  --tg-primary: var(--primary);
  --tg-primary-foreground: #ffffff;
  --tg-secondary: var(--secondary);
  --tg-secondary-foreground: #ffffff;
  --tg-muted: var(--surface2);
  --tg-muted-foreground: var(--muted);
  --tg-accent: var(--accent);
  --tg-accent-foreground: #ffffff;
  --tg-destructive: var(--danger);
  --tg-destructive-foreground: #ffffff;
  --tg-success: var(--success);
  --tg-success-foreground: #ffffff;
  --tg-warning: var(--warning);
  --tg-warning-foreground: #ffffff;
  --tg-border: var(--border);
  --tg-input: var(--border);
  --tg-ring: var(--primary);

  /* --- Radius scale --- */
  --tg-radius-small: 6px;
  --tg-radius-medium: 8px;
  --tg-radius-large: 12px;
  --tg-radius-full: 9999px;

  /* --- Typography tokens --- */
  --tg-font: 'Outfit', system-ui, -apple-system, sans-serif;
  --tg-font-mono: 'Geist Mono', 'SF Mono', 'Consolas', monospace;

  --tg-text-display: 32px;
  --tg-text-h1: 24px;
  --tg-text-h2: 20px;
  --tg-text-h3: 18px;
  --tg-text-body-lg: 17px;
  --tg-text-body: 16px;
  --tg-text-caption: 14px;
  --tg-text-label: 12px;

  /* --- Spacing scale --- */
  --tg-space-xs: 4px;
  --tg-space-sm: 8px;
  --tg-space-md: 12px;
  --tg-space-lg: 16px;
  --tg-space-xl: 24px;
  --tg-space-2xl: 32px;

  /* --- Radius (user spec) --- */
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 999px;

  /* --- Spacing (user spec, mirrored) --- */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 24px;
  --space-2xl: 32px;

  /* --- Shadows --- */
  --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.08);
  --shadow-elevated: 0 4px 12px rgba(15, 23, 42, 0.10);
  --shadow-modal: 0 8px 32px rgba(15, 23, 42, 0.15);

  /* --- Animation tokens --- */
  --ease-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --ease-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);
  --ease-slow: 400ms cubic-bezier(0.4, 0, 0.2, 1);
  --ease-spring: 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
  --pulse: 1.2s infinite alternate;

  /* --- Touch target --- */
  --touch-min: 56px;
  --tab-bar-height: 64px;
  --safe-area-bottom: 34px;
}

/* ============================================================
   2. DARK MODE (Phase 2 mappings)
   ============================================================ */
[data-theme="dark"] {
  --bg: #0f172a;
  --surface: #1e293b;
  --surface2: #334155;
  --ink: #f1f5f9;
  --ink2: #cbd5e1;
  --muted: #94a3b8;
  --border: #334155;

  --primary-light: #134e4a;
  --secondary-light: #0c4a6e;
  --danger-light: #7f1d1d;
  --warning-light: #78350f;
  --success-light: #14532d;
  --accent-light: #7c2d12;

  --tg-background: var(--bg);
  --tg-foreground: var(--ink);
  --tg-card: var(--surface);
  --tg-card-foreground: var(--ink);
  --tg-popover: var(--surface);
  --tg-popover-foreground: var(--ink);
  --tg-muted: var(--surface2);
  --tg-muted-foreground: var(--muted);
  --tg-border: var(--border);
  --tg-input: var(--border);
}

/* ============================================================
   3. TAILWIND v4 @theme INLINE
   ============================================================ */
@theme inline {
  --color-background: var(--bg);
  --color-foreground: var(--ink);
  --color-card: var(--surface);
  --color-card-foreground: var(--ink);
  --color-popover: var(--surface);
  --color-popover-foreground: var(--ink);
  --color-primary: var(--primary);
  --color-primary-foreground: #ffffff;
  --color-secondary: var(--secondary);
  --color-secondary-foreground: #ffffff;
  --color-muted: var(--surface2);
  --color-muted-foreground: var(--muted);
  --color-accent: var(--accent);
  --color-accent-foreground: #ffffff;
  --color-destructive: var(--danger);
  --color-destructive-foreground: #ffffff;
  --color-success: var(--success);
  --color-warning: var(--warning);
  --color-danger: var(--danger);
  --color-border: var(--border);
  --color-input: var(--border);
  --color-ring: var(--primary);

  --color-ink: var(--ink);
  --color-ink2: var(--ink2);
  --color-surface2: var(--surface2);

  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 999px;

  --font-sans: 'Outfit', system-ui, -apple-system, sans-serif;
  --font-mono: 'Geist Mono', 'SF Mono', monospace;
}

/* ============================================================
   4. BASE STYLES
   ============================================================ */
* {
  -webkit-tap-highlight-color: transparent;
}

html {
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--tg-font);
  background-color: var(--bg);
  color: var(--ink);
  line-height: 1.7;
  margin: 0;
  padding: 0;
  font-feature-settings: 'cv11', 'ss01';
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ---- Typography utility classes ---- */
.text-display { font-size: var(--tg-text-display); font-weight: 700; line-height: 1.2; }
.text-h1 { font-size: var(--tg-text-h1); font-weight: 700; line-height: 1.3; }
.text-h2 { font-size: var(--tg-text-h2); font-weight: 700; line-height: 1.4; }
.text-h3 { font-size: var(--tg-text-h3); font-weight: 600; line-height: 1.4; }
.text-body-lg { font-size: var(--tg-text-body-lg); font-weight: 400; line-height: 1.7; }
.text-body { font-size: var(--tg-text-body); font-weight: 400; line-height: 1.7; }
.text-caption { font-size: var(--tg-text-caption); font-weight: 400; line-height: 1.5; }
.text-label { font-size: var(--tg-text-label); font-weight: 600; line-height: 1.4; text-transform: uppercase; letter-spacing: 0.05em; }
.text-mono { font-family: var(--tg-font-mono); }

/* ---- Focus ring (WCAG 2.1 AA) ---- */
*:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

/* ---- Reduced motion ---- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0ms !important;
    transition-duration: 0ms !important;
  }
}

/* ============================================================
   5. COMPONENT CLASSES
   ============================================================ */

/* ---- Buttons ---- */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm);
  height: var(--touch-min);
  min-width: 200px;
  padding: 0 var(--space-xl);
  background: var(--primary);
  color: #ffffff;
  font-size: var(--tg-text-body-lg);
  font-weight: 700;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: transform var(--ease-fast), background var(--ease-fast);
}
.btn-primary:active { background: var(--primary-dark); transform: scale(0.98); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm);
  height: var(--touch-min);
  min-width: 200px;
  padding: 0 var(--space-xl);
  background: transparent;
  color: var(--primary);
  font-size: var(--tg-text-body-lg);
  font-weight: 700;
  border: 2px solid var(--primary);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: transform var(--ease-fast), background var(--ease-fast);
}
.btn-secondary:active { transform: scale(0.98); }

.btn-danger {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm);
  height: var(--touch-min);
  min-width: 200px;
  padding: 0 var(--space-xl);
  background: var(--danger);
  color: #ffffff;
  font-size: var(--tg-text-body-lg);
  font-weight: 700;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: transform var(--ease-fast);
}
.btn-danger:active { transform: scale(0.98); }

/* ---- Cards ---- */
.card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  padding: var(--space-lg);
}
.card-pressable {
  cursor: pointer;
  transition: transform var(--ease-normal), box-shadow var(--ease-normal);
}
.card-pressable:active {
  transform: scale(0.99);
  box-shadow: var(--shadow-elevated);
}

/* ---- Status badges ---- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: var(--space-xs);
  padding: 2px var(--space-sm);
  border-radius: var(--radius-pill);
  font-size: var(--tg-text-label);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.badge-on { background: var(--success-light); color: var(--success); }
.badge-off { background: var(--warning-light); color: var(--warning); }
.badge-danger { background: var(--danger-light); color: var(--danger); }
.badge-info { background: var(--secondary-light); color: var(--secondary); }
.badge-accent { background: var(--accent-light); color: var(--accent); }

/* ---- Status dots ---- */
.dot { width: 8px; height: 8px; border-radius: var(--radius-pill); display: inline-block; }
.dot-success { background: var(--success); }
.dot-warning { background: var(--warning); }
.dot-danger { background: var(--danger); }
.dot-primary { background: var(--primary); }

/* ---- Inputs ---- */
.input {
  width: 100%;
  height: var(--touch-min);
  padding: 0 var(--space-lg);
  font-size: var(--tg-text-body-lg);
  font-family: var(--tg-font);
  color: var(--ink);
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--radius-md);
  transition: border-color var(--ease-normal);
}
.input:focus { border-color: var(--primary); outline: none; }
.input-error { border-color: var(--danger); }

/* ---- Pulse animation (pending medication) ---- */
@keyframes tg-pulse {
  from { box-shadow: 0 0 0 0 rgba(13, 148, 136, 0.4); }
  to { box-shadow: 0 0 0 8px rgba(13, 148, 136, 0); }
}
.animate-pulse-ring { animation: var(--pulse); animation-name: tg-pulse; }

/* ---- Shimmer (skeleton loading) ---- */
@keyframes tg-shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
.skeleton {
  background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
  background-size: 200% 100%;
  animation: tg-shimmer 1.5s infinite;
}

/* ---- Spinner ---- */
@keyframes tg-spin {
  to { transform: rotate(360deg); }
}
.spinner {
  width: 24px;
  height: 24px;
  border: 3px solid rgba(255, 255, 255, 0.3);
  border-top-color: #ffffff;
  border-radius: 50%;
  animation: tg-spin 0.8s linear infinite;
}
.spinner-primary {
  border-color: rgba(13, 148, 136, 0.2);
  border-top-color: var(--primary);
}

/* ---- Mobile container ---- */
.mobile-frame {
  width: 390px;
  max-width: 100%;
  margin: 0 auto;
  background: var(--bg);
  min-height: 100vh;
  position: relative;
}

/* ---- Safe area bottom spacer ---- */
.safe-area-bottom {
  height: var(--safe-area-bottom);
}

      .alert-nav {
        position: sticky; top: 0; z-index: 20;
        height: 56px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 0 16px;
        display: flex; align-items: center; justify-content: space-between;
      }
      .icon-btn {
        width: 40px; height: 40px;
        display: inline-flex; align-items: center; justify-content: center;
        background: transparent; border: none; cursor: pointer;
        color: var(--ink);
        border-radius: var(--radius-sm);
      }
      .icon-btn:active { background: var(--surface2); }
      /* Severity bar inside event header */
      .severity-bar { height: 8px; background: var(--danger); border-radius: var(--radius-sm); width: 100%; }
      /* Pulsing danger dot for in-progress status */
      @keyframes danger-pulse {
        0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.5); }
        100% { box-shadow: 0 0 0 6px rgba(220, 38, 38, 0); }
      }
      .dot-danger-pulse {
        width: 8px; height: 8px; border-radius: var(--radius-pill);
        background: var(--danger); display: inline-block;
        animation: danger-pulse 1.2s infinite alternate;
      }
      /* Trigger rows */
      .trigger-row {
        display: flex; align-items: center; justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
      }
      .trigger-row:last-child { border-bottom: none; }
      /* Timeline */
      .tl-node { position: relative; padding-left: 28px; padding-bottom: 18px; }
      .tl-node:last-child { padding-bottom: 0; }
      .tl-line {
        position: absolute; left: 7px; top: 16px; bottom: 0;
        width: 2px; background: var(--border);
      }
      .tl-node:last-child .tl-line { display: none; }
      .tl-dot {
        position: absolute; left: 3px; top: 5px;
        width: 10px; height: 10px; border-radius: var(--radius-pill);
        border: 2px solid var(--surface);
      }
      /* Bottom action bar */
      .action-bar {
        position: fixed; left: 50%; transform: translateX(-50%);
        bottom: 0; width: 390px; max-width: 100%;
        background: var(--surface);
        border-top: 1px solid var(--border);
        padding: 16px;
        display: flex; gap: 12px;
        padding-bottom: calc(16px + var(--safe-area-bottom));
        z-index: 30;
      }
      .action-bar .btn-primary,
      .action-bar .btn-secondary { min-width: 0; flex: 1; }
    </style>

    <!-- Top red accent -->
    <div class="alert-top-accent" aria-hidden="true"></div>

    <!-- 1. Navigation bar -->
    <nav class="alert-nav">
      <button class="icon-btn" data-dom-id="back-btn" aria-label="返回">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <h1 class="text-h2" style="color: var(--ink);">警报详情</h1>
      <span style="width:40px; display:inline-block;" aria-hidden="true"></span>
    </nav>

    <!-- 2. Event header -->
    <section class="card" data-dom-id="event-header" style="margin: 16px; padding: 0; overflow: hidden;">
      <div class="severity-bar" aria-hidden="true"></div>
      <div style="padding: var(--space-lg);">
        <div style="display:flex; align-items:center; gap:14px; margin-bottom:14px;">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;">
            <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
          <div>
            <div class="text-h1" style="color: var(--ink);">震颤异常升高</div>
            <span class="badge badge-danger" style="margin-top:6px;">
              <span class="dot-danger-pulse" aria-hidden="true"></span>
              进行中
            </span>
          </div>
        </div>
        <div style="display:flex; gap:24px; flex-wrap:wrap;">
          <div>
            <div class="text-label" style="color: var(--muted); margin-bottom:2px;">触发时间</div>
            <div class="text-mono" style="color: var(--ink2); font-size:15px; font-weight:500;">14:02</div>
          </div>
          <div>
            <div class="text-label" style="color: var(--muted); margin-bottom:2px;">持续时长</div>
            <div class="text-mono" style="color: var(--ink2); font-size:15px; font-weight:500;">8 分钟</div>
          </div>
        </div>
      </div>
    </section>

    <!-- 3. Tremor curve -->
    <section class="card" data-dom-id="tremor-curve" style="margin: 0 16px 16px; padding: 16px;">
      <div style="margin-bottom:10px;">
        <h2 class="text-h3" style="color: var(--ink);">震颤曲线</h2>
        <p class="text-caption" style="color: var(--muted);">触发前 10 分钟至事件全程</p>
      </div>

      <svg viewBox="0 0 340 180" width="100%" height="180" role="img" aria-label="震颤幅度随时间变化曲线，14:02 超过阈值 2.0cm，14:04 达到峰值 2.8cm，14:05 服药后下降" style="display:block;">
        <!-- Gridlines -->
        <line x1="40" y1="39"  x2="320" y2="39"  stroke="var(--border)" stroke-width="1"/>
        <line x1="40" y1="76"  x2="320" y2="76"  stroke="var(--border)" stroke-width="1"/>
        <line x1="40" y1="113" x2="320" y2="113" stroke="var(--border)" stroke-width="1"/>

        <!-- Axes -->
        <line x1="40" y1="20"  x2="40"  y2="150" stroke="var(--border)" stroke-width="1"/>
        <line x1="40" y1="150" x2="320" y2="150" stroke="var(--border)" stroke-width="1"/>

        <!-- Y labels -->
        <text x="34" y="42"  text-anchor="end" font-size="10" font-family="var(--tg-font-mono)" fill="var(--muted)">3.0</text>
        <text x="34" y="79"  text-anchor="end" font-size="10" font-family="var(--tg-font-mono)" fill="var(--muted)">2.0</text>
        <text x="34" y="116" text-anchor="end" font-size="10" font-family="var(--tg-font-mono)" fill="var(--muted)">1.0</text>
        <text x="34" y="153" text-anchor="end" font-size="10" font-family="var(--tg-font-mono)" fill="var(--muted)">0</text>

        <!-- X labels -->
        <text x="40"  y="166" text-anchor="middle" font-size="10" font-family="var(--tg-font-mono)" fill="var(--muted)">13:52</text>
        <text x="164" y="166" text-anchor="middle" font-size="10" font-family="var(--tg-font-mono)" fill="var(--muted)">14:00</text>
        <text x="320" y="166" text-anchor="middle" font-size="10" font-family="var(--tg-font-mono)" fill="var(--muted)">14:10</text>

        <!-- Medication marker (vertical dashed line at 14:05 -> x=242) -->
        <line x1="242" y1="20" x2="242" y2="150" stroke="var(--secondary)" stroke-width="1.5" stroke-dasharray="3,3"/>
        <text x="242" y="15" text-anchor="middle" font-size="10" font-family="var(--tg-font-mono)" fill="var(--secondary)" font-weight="600">服药</text>

        <!-- Amplitude fill area -->
        <path d="M 40,120 C 90,124 130,118 164,105 C 178,98 186,90 196,76 C 206,62 216,50 227,46 C 234,44 239,49 242,53 C 252,62 280,75 320,83 L 320,150 L 40,150 Z"
              fill="var(--primary)" fill-opacity="0.08" stroke="none"/>

        <!-- Threshold dashed line at y=76 (2.0cm) -->
        <line x1="40" y1="76" x2="320" y2="76" stroke="var(--danger)" stroke-width="1.5" stroke-dasharray="5,3"/>
        <text x="316" y="71" text-anchor="end" font-size="10" font-family="var(--tg-font-mono)" fill="var(--danger)" font-weight="600">阈值 2.0cm</text>

        <!-- Amplitude curve -->
        <path d="M 40,120 C 90,124 130,118 164,105 C 178,98 186,90 196,76 C 206,62 216,50 227,46 C 234,44 239,49 242,53 C 252,62 280,75 320,83"
              fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Threshold crossing point -->
        <circle cx="196" cy="76" r="3.5" fill="var(--danger)" stroke="var(--surface)" stroke-width="1.5"/>
        <text x="196" y="68" text-anchor="middle" font-size="9" font-family="var(--tg-font-mono)" fill="var(--danger)" font-weight="600">14:02</text>
      </svg>
    </section>

    <!-- 4. Trigger condition -->
    <section class="card" data-dom-id="trigger-card" style="margin: 0 16px 16px; padding: 16px;">
      <h2 class="text-h3" style="color: var(--ink); margin-bottom:6px;">触发条件</h2>
      <div class="trigger-row">
        <span class="text-body" style="color: var(--ink2);">振幅峰值</span>
        <span class="text-mono" style="color: var(--danger); font-weight:600;">2.8 cm</span>
      </div>
      <div class="trigger-row">
        <span class="text-body" style="color: var(--ink2);">上升速率</span>
        <span class="text-mono" style="color: var(--ink); font-weight:500;">0.4 cm/min</span>
      </div>
      <div class="trigger-row">
        <span class="text-body" style="color: var(--ink2);">超阈值持续</span>
        <span class="text-mono" style="color: var(--ink); font-weight:500;">6 分钟</span>
      </div>
      <div class="trigger-row">
        <span class="text-body" style="color: var(--ink2);">个体化阈值</span>
        <span class="text-mono" style="color: var(--muted); font-weight:500;">2.0 cm</span>
      </div>
    </section>

    <!-- 5. Intervention timeline -->
    <section class="card" data-dom-id="intervention-timeline" style="margin: 0 16px 16px; padding: 16px;">
      <h2 class="text-h3" style="color: var(--ink); margin-bottom:14px;">干预记录</h2>

      <div class="tl-node">
        <span class="tl-line" aria-hidden="true"></span>
        <span class="tl-dot" style="background: var(--danger);" aria-hidden="true"></span>
        <div class="text-mono" style="color: var(--ink); font-size:14px; font-weight:600;">14:02</div>
        <div class="text-body" style="color: var(--ink2);">警报触发，震幅超阈值</div>
        <div class="text-caption" style="color: var(--muted);">系统</div>
      </div>

      <div class="tl-node">
        <span class="tl-line" aria-hidden="true"></span>
        <span class="tl-dot" style="background: var(--secondary);" aria-hidden="true"></span>
        <div class="text-mono" style="color: var(--ink); font-size:14px; font-weight:600;">14:03</div>
        <div class="text-body" style="color: var(--ink2);">用户确认警报</div>
        <div class="text-caption" style="color: var(--muted);">张明（患者）</div>
      </div>

      <div class="tl-node">
        <span class="tl-line" aria-hidden="true"></span>
        <span class="tl-dot" style="background: var(--secondary);" aria-hidden="true"></span>
        <div class="text-mono" style="color: var(--ink); font-size:14px; font-weight:600;">14:05</div>
        <div class="text-body" style="color: var(--ink2);">记录服药 左旋多巴 250mg</div>
        <div class="text-caption" style="color: var(--muted);">张明（患者）</div>
      </div>

      <div class="tl-node">
        <span class="tl-dot" style="background: var(--muted);" aria-hidden="true"></span>
        <div class="text-mono" style="color: var(--ink); font-size:14px; font-weight:600;">14:10</div>
        <div class="text-body" style="color: var(--ink2);">振幅开始下降，响应追踪中</div>
        <div class="text-caption" style="color: var(--muted);">系统</div>
      </div>
    </section>

    <!-- 6. Bottom action bar -->
    <div class="action-bar">
      <button class="btn-primary" data-dom-id="generate-report-btn" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="9" y1="13" x2="15" y2="13"></line>
          <line x1="9" y1="17" x2="15" y2="17"></line>
        </svg>
        生成事件报告
      </button>
      <button class="btn-secondary" data-dom-id="mark-resolved-btn" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        标记已处理
      </button>
    </div>
  </main>
  <script>lucide.createIcons();</script>
</body>
</html>
