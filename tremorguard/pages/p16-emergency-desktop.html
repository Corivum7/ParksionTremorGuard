/* ============================================================
   TremorGuard Design System — colors_and_type.css
   Parkinson's Tremor Monitoring Platform
   WCAG 2.1 AA · 56px touch targets · 17px body baseline
   ============================================================ */

/* ---- Font Imports ---- */
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap');

/* ============================================================
   1. SEMANTIC ALIASES (brand prefix: tg)
   ============================================================ */
:root {
  /* --- Core palette (user-specified exact values) --- */
  --primary: #0d9488;
  --primary-dark: #0f766e;
  --primary-light: #ccfbf1;

  --secondary: #0369a1;
  --secondary-light: #e0f2fe;

  --danger: #dc2626;
  --danger-light: #fee2e2;
  --warning: #d97706;
  --warning-light: #fef3c7;
  --success: #16a34a;
  --success-light: #dcfce7;
  --accent: #c2410c;
  --accent-light: #fed7aa;

  --bg: #f8fafc;
  --surface: #ffffff;
  --surface2: #f1f5f9;
  --ink: #0f172a;
  --ink2: #334155;
  --muted: #64748b;
  --border: #e2e8f0;

  /* --- Semantic aliases (tg prefix) --- */
  --tg-background: var(--bg);
  --tg-foreground: var(--ink);
  --tg-card: var(--surface);
  --tg-card-foreground: var(--ink);
  --tg-popover: var(--surface);
  --tg-popover-foreground: var(--ink);
  --tg-primary: var(--primary);
  --tg-primary-foreground: #ffffff;
  --tg-secondary: var(--secondary);
  --tg-secondary-foreground: #ffffff;
  --tg-muted: var(--surface2);
  --tg-muted-foreground: var(--muted);
  --tg-accent: var(--accent);
  --tg-accent-foreground: #ffffff;
  --tg-destructive: var(--danger);
  --tg-destructive-foreground: #ffffff;
  --tg-success: var(--success);
  --tg-success-foreground: #ffffff;
  --tg-warning: var(--warning);
  --tg-warning-foreground: #ffffff;
  --tg-border: var(--border);
  --tg-input: var(--border);
  --tg-ring: var(--primary);

  /* --- Radius scale --- */
  --tg-radius-small: 6px;
  --tg-radius-medium: 8px;
  --tg-radius-large: 12px;
  --tg-radius-full: 9999px;

  /* --- Typography tokens --- */
  --tg-font: 'Outfit', system-ui, -apple-system, sans-serif;
  --tg-font-mono: 'Geist Mono', 'SF Mono', 'Consolas', monospace;

  --tg-text-display: 32px;
  --tg-text-h1: 24px;
  --tg-text-h2: 20px;
  --tg-text-h3: 18px;
  --tg-text-body-lg: 17px;
  --tg-text-body: 16px;
  --tg-text-caption: 14px;
  --tg-text-label: 12px;

  /* --- Spacing scale --- */
  --tg-space-xs: 4px;
  --tg-space-sm: 8px;
  --tg-space-md: 12px;
  --tg-space-lg: 16px;
  --tg-space-xl: 24px;
  --tg-space-2xl: 32px;

  /* --- Radius (user spec) --- */
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 999px;

  /* --- Spacing (user spec, mirrored) --- */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 24px;
  --space-2xl: 32px;

  /* --- Shadows --- */
  --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.08);
  --shadow-elevated: 0 4px 12px rgba(15, 23, 42, 0.10);
  --shadow-modal: 0 8px 32px rgba(15, 23, 42, 0.15);

  /* --- Animation tokens --- */
  --ease-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --ease-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);
  --ease-slow: 400ms cubic-bezier(0.4, 0, 0.2, 1);
  --ease-spring: 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
  --pulse: 1.2s infinite alternate;

  /* --- Touch target --- */
  --touch-min: 56px;
  --tab-bar-height: 64px;
  --safe-area-bottom: 34px;
}

/* ============================================================
   2. DARK MODE (Phase 2 mappings)
   ============================================================ */
[data-theme="dark"] {
  --bg: #0f172a;
  --surface: #1e293b;
  --surface2: #334155;
  --ink: #f1f5f9;
  --ink2: #cbd5e1;
  --muted: #94a3b8;
  --border: #334155;
  --primary-light: #134e4a;
  --secondary-light: #0c4a6e;
  --danger-light: #7f1d1d;
  --warning-light: #78350f;
  --success-light: #14532d;
  --accent-light: #7c2d12;
  --tg-background: var(--bg);
  --tg-foreground: var(--ink);
  --tg-card: var(--surface);
  --tg-card-foreground: var(--ink);
  --tg-popover: var(--surface);
  --tg-popover-foreground: var(--ink);
  --tg-muted: var(--surface2);
  --tg-muted-foreground: var(--muted);
  --tg-border: var(--border);
  --tg-input: var(--border);
}

/* ============================================================
   3. BASE STYLES
   ============================================================ */
* { -webkit-tap-highlight-color: transparent; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--tg-font);
  background-color: var(--bg);
  color: var(--ink);
  line-height: 1.7;
  margin: 0;
  padding: 0;
  font-feature-settings: 'cv11', 'ss01';
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.text-display { font-size: var(--tg-text-display); font-weight: 700; line-height: 1.2; }
.text-h1 { font-size: var(--tg-text-h1); font-weight: 700; line-height: 1.3; }
.text-h2 { font-size: var(--tg-text-h2); font-weight: 700; line-height: 1.4; }
.text-h3 { font-size: var(--tg-text-h3); font-weight: 600; line-height: 1.4; }
.text-body-lg { font-size: var(--tg-text-body-lg); font-weight: 400; line-height: 1.7; }
.text-body { font-size: var(--tg-text-body); font-weight: 400; line-height: 1.7; }
.text-caption { font-size: var(--tg-text-caption); font-weight: 400; line-height: 1.5; }
.text-label { font-size: var(--tg-text-label); font-weight: 600; line-height: 1.4; text-transform: uppercase; letter-spacing: 0.05em; }
.text-mono { font-family: var(--tg-font-mono); }

*:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0ms !important;
    transition-duration: 0ms !important;
  }
}

/* ============================================================
   4. EMERGENCY DESKTOP LAYOUT — Full-screen overlay
   ============================================================ */
.emergency-overlay {
  background: var(--danger);
  color: #ffffff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
  box-sizing: border-box;
}

.emergency-container {
  max-width: 600px;
  width: 100%;
  margin: 0 auto;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 32px;
}

/* ---- Pulsing dot ---- */
@keyframes tg-emergency-pulse {
  0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.65); }
  50% { opacity: 0.75; transform: scale(1.18); box-shadow: 0 0 0 14px rgba(255, 255, 255, 0); }
}
.pulse-dot {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-pill);
  background: #ffffff;
  display: inline-block;
  animation: tg-emergency-pulse 1.2s ease-in-out infinite;
}

/* ---- Status display ---- */
.status-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.status-section h1 {
  font-size: 32px;
  font-weight: 700;
  color: #ffffff;
  margin: 6px 0 0 0;
  line-height: 1.3;
  letter-spacing: 0.02em;
}
.amplitude-display {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 4px;
  margin-top: 4px;
}
.amplitude-value {
  font-size: 48px;
  font-weight: 700;
  color: #ffffff;
  line-height: 1.1;
  font-family: var(--tg-font-mono);
  letter-spacing: -0.02em;
}
.amplitude-unit {
  font-size: 22px;
  font-weight: 500;
  color: #ffffff;
  font-family: var(--tg-font-mono);
}
.threshold-comparison,
.duration {
  font-size: 18px;
  color: rgba(255, 255, 255, 0.8);
  margin: 0;
  line-height: 1.5;
}
.duration { font-weight: 600; }

/* ---- Action buttons ---- */
.actions-section {
  display: flex;
  flex-direction: row;
  justify-content: center;
  gap: 16px;
}
.btn-emergency {
  height: 56px;
  min-width: 200px;
  border-radius: var(--radius-lg);
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: transform var(--ease-fast), background var(--ease-fast);
  font-family: var(--tg-font);
}
.btn-emergency:active { transform: scale(0.97); }
.btn-medication {
  background: #ffffff;
  color: var(--danger);
  border: none;
}
.btn-medication:hover { background: #fff1f1; }
.btn-help {
  background: transparent;
  color: #ffffff;
  border: 2px solid #ffffff;
}
.btn-help:hover { background: rgba(255, 255, 255, 0.12); }

/* ---- Notification status ---- */
.notification-section {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: #ffffff;
  font-size: 16px;
  line-height: 1.5;
}
.notification-section .notif-text { opacity: 0.95; }

/* ---- Emergency contacts ---- */
.contacts-section {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.contact-card {
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.28);
  border-radius: var(--radius-lg);
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  backdrop-filter: blur(4px);
}
.contact-avatar {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-pill);
  background: rgba(255, 255, 255, 0.25);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 600;
}
.contact-name {
  font-size: 15px;
  font-weight: 600;
  color: #ffffff;
  line-height: 1.3;
}
.contact-relation {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.78);
  line-height: 1.3;
}
.contact-call-btn {
  background: #ffffff;
  color: var(--danger);
  border: none;
  border-radius: var(--radius-pill);
  padding: 6px 16px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: transform var(--ease-fast);
  font-family: var(--tg-font);
}
.contact-call-btn:active { transform: scale(0.96); }

/* ---- Real-time curve ---- */
.curve-section {
  position: relative;
  width: 100%;
}
.curve-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.curve-label {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.7);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 600;
}
.curve-threshold-label {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.7);
  font-family: var(--tg-font-mono);
}
.curve-svg {
  display: block;
  width: 100%;
  height: 120px;
}

/* ============================================================
   5. RESPONSIVE — Mobile adaptive
   ============================================================ */
@media (max-width: 767px) {
  .emergency-overlay { padding: 32px 20px; }
  .emergency-container { gap: 24px; }
  .status-section h1 { font-size: 26px; }
  .amplitude-value { font-size: 40px; }
  .amplitude-unit { font-size: 18px; }
  .threshold-comparison,
  .duration { font-size: 16px; }
  .actions-section {
    flex-direction: column;
    gap: 12px;
  }
  .btn-emergency {
    width: 100%;
    min-width: unset;
  }
  .contacts-section {
    grid-template-columns: 1fr;
    gap: 10px;
  }
  .contact-card {
    flex-direction: row;
    justify-content: flex-start;
    padding: 12px 16px;
    gap: 12px;
  }
  .contact-avatar { width: 40px; height: 40px; flex-shrink: 0; }
  .contact-info {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    flex: 1;
    text-align: left;
  }
  .contact-call-btn { margin-left: auto; }
  .curve-svg { height: 90px; }
}
